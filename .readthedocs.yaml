# Read the Docs build configuration (issue #142, ADR 0030).
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Publishes only docs/public/ -- the pack guides, reference, and explanations --
# as a browsable site with per-pull-request previews. docs/public/ is the sole
# Sphinx source root (ADR 0030): ADRs and other maintainer records live elsewhere
# under docs/ and never enter the built site, its search index, or its sitemap.
#
# The docs toolchain is hash-locked in requirements/docs.txt like every other
# install in this repository, so a Read the Docs build resolves the same
# artifacts as a local one (ADR 0004, #142). The package itself is NOT installed:
# these pages are narrative markdown with no autodoc, and installing would pull
# the entire pinned raes runtime closure just to render text. docs/public/conf.py
# reads the version from pyproject.toml instead.

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Matches the version CI, SonarCloud, and the release build all use, so the
    # docs build cannot drift onto a different interpreter than everything else.
    python: "3.12"

sphinx:
  configuration: docs/public/conf.py
  # Surface broken cross-references as build failures rather than publishing
  # them; docs/public/conf.py sets nitpicky mode to match.
  fail_on_warning: true

python:
  install:
    - requirements: requirements/docs.txt

formats:
  - pdf
