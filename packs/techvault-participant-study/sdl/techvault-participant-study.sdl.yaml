name: techvault-participant-study
description: >-
  Portable TechVault scenario state: systems, identities, content, weaknesses, access, and evidence needs. A consuming backend chooses how to realize that state.
# Flag values are provided per run by whoever instantiates the scenario; the
# pack never authors them.
variables:
  flag_victim_user:
    type: string
    required: true
    description: User-level flag value placed on victim.
  flag_victim_root:
    type: string
    required: true
    description: Root-level flag value placed on victim.
  flag_workstation_user:
    type: string
    required: true
    description: User-level flag value placed on workstation.
  flag_workstation_root:
    type: string
    required: true
    description: Root-level flag value placed on workstation.
  flag_webapp_user:
    type: string
    required: true
    description: User-level flag value placed on webapp.
  flag_webapp_root:
    type: string
    required: true
    description: Root-level flag value placed on webapp.
  flag_fileshare_user:
    type: string
    required: true
    description: User-level flag value placed on fileshare.
  flag_fileshare_root:
    type: string
    required: true
    description: Root-level flag value placed on fileshare.
  flag_ad_user:
    type: string
    required: true
    description: User-level flag value placed on the domain controller.
  flag_ad_root:
    type: string
    required: true
    description: Root-level flag value placed on the domain controller.
nodes:
  security-net:
    type: switch
    description: SOC and security tooling network.
  dmz-net:
    type: switch
    description: TechVault DMZ network.
  internal-net:
    type: switch
    description: Internal enterprise target network.
  redteam-net:
    type: switch
    description: Red-team operations network.
  wazuh-manager:
    type: compute
    os: linux
    services:
      - {name: wazuh-api, port: 55000, protocol: tcp}
      - {name: agent-events, port: 1514, protocol: tcp}
      - {name: agent-enrollment, port: 1515, protocol: tcp}
      - {name: syslog, port: 514, protocol: udp}
    runtime:
      security_monitoring_managers:
        - security_monitoring_manager_id: wazuh-manager
          implementation: wazuh
          manager_kind: siem
          version: 4.12.0
          name: TechVault SIEM
          description: The scenario's SIEM. Agents enroll here, ship events here, and the analysis engine evaluates them against the rule corpora below.
          listeners:
            - listener_id: agent-events
              service: agent-events
              role: agent_event_ingestion
              protocol: tcp
              auth_required: true
              tls_enabled: false
            - listener_id: agent-enrollment
              service: agent-enrollment
              role: agent_enrollment
              protocol: tcp
              auth_required: true
              tls_enabled: true
            - listener_id: syslog
              service: syslog
              role: syslog_ingestion
              protocol: udp
              auth_required: false
              tls_enabled: false
            - listener_id: wazuh-api
              service: wazuh-api
              role: api
              protocol: tcp
              auth_required: true
              tls_enabled: true
          components:
            - component_id: analysisd
              kind: analysis_engine
              name: wazuh-analysisd
              enabled: true
            - component_id: remoted
              kind: agent_ingestion
              name: wazuh-remoted
              enabled: true
            - component_id: authd
              kind: agent_enrollment
              name: wazuh-authd
              enabled: true
            - component_id: apid
              kind: api
              name: wazuh-apid
              enabled: true
            - component_id: indexer-forwarder
              kind: indexer_forwarder
              name: filebeat
              enabled: true
          agents:
            - agent_id: suricata-agent
              name: techvault-suricata-agent
              node_ref: suricata
              status: active
              description: Ships Suricata EVE events; see that node’s forwarding agent.
            - agent_id: db-agent
              name: techvault-db-agent
              node_ref: db
              status: active
              description: Ships PostgreSQL logs; see that node’s forwarding agent.
            - agent_id: ad-agent
              name: techvault-ad-agent
              node_ref: ad
              status: active
              description: Ships the domain controller’s Samba logs; see that node’s forwarding agent.
            - agent_id: webapp-agent
              name: techvault-webapp-agent
              node_ref: webapp
              status: active
              description: Ships customer portal access logs; see that node’s forwarding agent.
            - agent_id: dns-agent
              name: techvault-dns-agent
              node_ref: dns
              status: active
              description: Ships DNS service logs; see that node’s forwarding agent.
            - agent_id: fileshare-agent
              name: techvault-fileshare-agent
              node_ref: fileshare
              status: active
              description: Ships file server Samba logs; see that node’s forwarding agent.
            - agent_id: victim-agent
              name: techvault-victim-agent
              node_ref: victim
              status: active
              description: Ships victim authentication and system logs; see that node’s forwarding agent.
            - agent_id: workstation-agent
              name: techvault-workstation-agent
              node_ref: workstation
              status: active
              description: Ships workstation authentication and system logs.
          content_sets:
            - content_id: webapp-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: webapp_rules.xml
              file_count: 1
              file_refs:
                - /var/ossec/etc/rules/webapp_rules.xml
              loaded: true
              description: Web-application attack rules, including the SQL-injection detections the range exercises.
            - content_id: suricata-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: suricata_rules.xml
              file_count: 1
              file_refs:
                - /var/ossec/etc/rules/suricata_rules.xml
              loaded: true
              description: Rules that fire on Suricata EVE events arriving from the network sensor.
            - content_id: ad-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: ad_rules.xml
              file_count: 1
              file_refs:
                - /var/ossec/etc/rules/ad_rules.xml
              loaded: true
              description: Active Directory authentication and abuse rules.
            - content_id: database-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: database_rules.xml
              file_count: 1
              file_refs:
                - /var/ossec/etc/rules/database_rules.xml
              loaded: true
              description: Customer-database access and abuse rules.
            - content_id: falco-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: falco_rules.xml
              file_count: 1
              file_refs:
                - /var/ossec/etc/rules/falco_rules.xml
              loaded: true
              description: Container runtime rules.
            - content_id: postgresql-decoders
              kind: decoder_corpus
              format: wazuh_decoder_xml
              name: postgresql_decoders.xml
              file_count: 1
              file_refs:
                - /var/ossec/etc/decoders/postgresql_decoders.xml
              loaded: true
              description: Decoders that make PostgreSQL log lines parseable by the rules.
            - content_id: samba-decoders
              kind: decoder_corpus
              format: wazuh_decoder_xml
              name: samba_decoders.xml
              file_count: 1
              file_refs:
                - /var/ossec/etc/decoders/samba_decoders.xml
              loaded: true
              description: Decoders for Samba file-share activity.
          detection_definitions:
            - definition_id: sqli-special-characters
              engine: wazuh
              definition_kind: rule
              native_id: '302011'
              content_set_ref: webapp-rules
              level: 8
              enabled: true
              loaded: true
              name: 'Potential SQL injection: special characters in URL'
              description: The detection the range's SQL-injection path is expected to trigger. Named here because the scenario depends on it firing, not merely on the corpus being loaded.
              groups:
                - webapp
                - sqli
                - web_attack
            - definition_id: sqli-union-select
              engine: wazuh
              definition_kind: rule
              native_id: '302010'
              content_set_ref: webapp-rules
              level: 10
              enabled: true
              loaded: true
              name: SQL injection attempt detected in URL
              groups:
                - webapp
                - sqli
                - web_attack
  wazuh-indexer:
    type: compute
    os: linux
    services:
      - {name: indexer-api, port: 9200, protocol: tcp}
    runtime:
      datastore_services:
        - datastore_service_id: wazuh-indexer
          engine: opensearch
          data_model: search_index
          version: 4.12.0
          description: Alert store for the SIEM. Alert indices are created on first ingest; the templates that shape them exist from boot.
          partitions:
            - partition_id: kibana
              kind: index
              name: .kibana_1
              shard_count: 1
              replica_count: 0
            - partition_id: security
              kind: index
              name: .opendistro_security
              shard_count: 1
              replica_count: 0
            - partition_id: observability
              kind: index
              name: .opensearch-observability
              shard_count: 1
              replica_count: 0
            - partition_id: ml-config
              kind: index
              name: .plugins-ml-config
              shard_count: 1
              replica_count: 0
          templates:
            - template_id: wazuh-agent
              name: wazuh-agent
            - template_id: wazuh-statistics
              name: wazuh-statistics
          mappings:
            - mapping_id: kibana-objects
              name: .kibana_1
              partition_ref: kibana
              top_level_field_count: 28
              description: Saved-object mapping for the dashboard tier.
  wazuh-dashboard:
    type: compute
    os: linux
    services:
      - {name: dashboard, port: 5601, protocol: tcp}
    runtime:
      service_listeners:
        - service_listener_id: dashboard-listener
          service: dashboard
          address: 0.0.0.0
          port: 5601
          protocol: tcp
          scope: wildcard
          provenance: operator
      applications:
        - application_id: wazuh-dashboard
          service: dashboard
          protocol: https
          routes:
            - route_id: dashboard-root
              path: /
              methods: [GET]
              auth_required: true
      platform_applications:
        - platform_application_id: wazuh-dashboard
          service: dashboard
          platform_kind: analytics_dashboard
          product: Wazuh Dashboard
          capabilities:
            - capability_id: analytics-presentation
              kind: analytics_presentation
          upstream_bindings:
            - binding_id: wazuh-index-backend
              role: index_backend
              target_node_ref: wazuh-indexer
              target_service_ref: indexer-api
            - binding_id: wazuh-manager-api
              role: data_source
              target_node_ref: wazuh-manager
              target_service_ref: wazuh-api
          version: 4.12.0
  suricata:
    type: compute
    os: linux
    services: []
    runtime:
      software_components:
        - component_id: wazuh-agent
          name: Wazuh agent
          component_type: application
          presence: required
          version: 4.12.0
          description: Required endpoint software; acquisition and process realization are delegated.
      network_sensors:
        - network_sensor_id: suricata-sensor
          implementation: suricata
          sensor_kind: ids
          monitoring_posture: passive
          monitored_network_refs:
            - security-net
            - dmz-net
            - internal-net
            - redteam-net
          name: TechVault network sensor
          description: Watches range traffic passively. Its EVE output is what the node's Wazuh agent ships, so this is where network visibility enters the SOC.
      network_detection_engines:
        - network_detection_engine_id: suricata-engine
          implementation: suricata
          engine_kind: ids
          sensor_ref: suricata-sensor
          name: TechVault detection engine
          description: Evaluates captured traffic against its rule sources and writes EVE events. MISP-derived rules are reloaded here over the command socket.
          configuration_file_refs:
            - /etc/suricata/suricata.yaml
          log_file_refs:
            - /var/log/suricata/eve.json
            - /var/log/suricata/fast.log
          evidence_refs:
            - /var/log/suricata/eve.json
          app_layer_protocols:
            - http
            - tls
            - dns
            - ssh
            - smb
            - smtp
            - ftp
          rule_sources:
            - source_id: suricata-builtin
              kind: built_in
              format: suricata_rule
              name: suricata.rules
              file_refs:
                - /var/lib/suricata/rules/suricata.rules
              loaded: true
              description: Product-provided ruleset selected alongside Suricata 7.0.
            - source_id: techvault-local
              kind: local
              format: suricata_rule
              name: local.rules
              rule_count: 16
              file_refs:
                - /etc/suricata/rules/local.rules
              loaded: true
              description: Scenario-authored rules for TechVault-specific activity.
            - source_id: misp-iocs
              kind: ioc
              format: suricata_rule
              name: misp/misp-iocs.rules
              file_refs:
                - /var/lib/suricata/rules/misp/misp-iocs.rules
              loaded: true
              generated_by: nodes.misp-suricata-sync.runtime.forwarding_agents.misp-ioc-to-suricata
              description: Written by the MISP sync agent, not authored here. This is the threat-intelligence feed becoming live detection content.
          network_sets:
            - set_id: home-net
              kind: home_net
              name: HOME_NET
              selector_values:
                - 172.20.0.0/16
              network_refs:
                - security-net
                - dmz-net
                - internal-net
                - redteam-net
              description: The range itself; everything outside it is EXTERNAL_NET.
            - set_id: external-net
              kind: external_net
              name: EXTERNAL_NET
              selector_values:
                - "!172.20.0.0/16"
              description: Addresses outside the TechVault range.
            - set_id: dmz-net
              kind: dmz_net
              name: DMZ_NET
              selector_values:
                - 172.20.1.0/24
              network_refs:
                - dmz-net
            - set_id: internal-net
              kind: internal_net
              name: INTERNAL_NET
              selector_values:
                - 172.20.2.0/24
              network_refs:
                - internal-net
            - set_id: http-servers
              kind: service_group
              name: HTTP_SERVERS
              selector_values:
                - 172.20.1.20
              network_refs:
                - dmz-net
          output_streams:
            - stream_id: eve-json
              format: eve_json
              path: /var/log/suricata/eve.json
              event_types:
                - alert
                - http
                - dns
                - tls
                - ssh
                - flow
                - stats
              enabled: true
              description: The file the node's Wazuh agent tails. This path is the detection-to-SIEM hand-off.
            - stream_id: fast-log
              format: fast_log
              path: /var/log/suricata/fast.log
              event_types:
                - alert
              enabled: true
              description: Bounded human-readable alert output used with native engine readiness diagnostics.
          control_channels:
            - channel_id: command-socket
              kind: unix_socket
              path: /var/run/suricata/suricata-command.socket
              capabilities:
                - rule_reload
              auth_required: false
              description: Where the MISP sync agent drives a reload after writing rules.
          version: "7.0"
      forwarding_agents:
        - forwarding_agent_id: suricata-eve-forwarder
          implementation: wazuh_agent
          version: 4.12.0
          agent_kind: log_forwarder
          name: techvault-suricata-agent
          description: Tails Suricata's EVE output and ships it to the Wazuh manager. This is the hand-off that makes network detections visible to the SIEM.
          sources:
            - source_id: suricata-eve
              kind: tailed_path
              location: /var/log/suricata/eve.json
              parse_format: eve_json
          transforms:
            - transform_id: eve-parse
              kind: parse
          buffer_policy:
            buffer_policy_id: suricata-eve-forwarder-buffer
            crypto: aes
          ship_targets:
            - target_id: suricata-eve-forwarder-manager
              target_node_ref: wazuh-manager
              target_service_ref: agent-events
              ingestion_port: 1514
              protocol: tcp
            - target_id: suricata-agent-enrollment
              target_node_ref: wazuh-manager
              target_service_ref: agent-enrollment
              enrollment_port: 1515
              protocol: tcp
              enrollment_identity_classification: operator_secret
  misp:
    type: compute
    os: linux
    services:
      - {name: https, port: 443, protocol: tcp}
    runtime:
      service_listeners:
        - service_listener_id: misp-https-listener
          service: https
          address: 0.0.0.0
          port: 443
          protocol: tcp
          scope: wildcard
          readiness:
            probe: misp-authenticated-api-operation
            criteria: A certificate-verified, authenticated MISP API write and read succeeds through the declared MariaDB and Redis services.
            evidence_refs: [misp-authenticated-api-readiness]
            description: Application readiness requires the real authenticated data paths, not only a listener or login page.
          provenance: operator
      applications:
        - application_id: misp-web
          service: https
          protocol: https
          routes:
            - route_id: misp-root
              path: /
              methods: [GET]
              auth_required: true
      platform_applications:
        - platform_application_id: misp-threat-intelligence
          service: https
          platform_kind: threat_intel
          product: MISP
          capabilities:
            - capability_id: threat-intelligence-management
              kind: threat_intelligence_management
            - capability_id: intelligence-exchange
              kind: intelligence_exchange
          upstream_bindings:
            - binding_id: misp-relational-store
              role: data_source
              target_node_ref: misp-db
              target_service_ref: mysql
            - binding_id: misp-cache-store
              role: data_source
              target_node_ref: misp-redis
              target_service_ref: redis
          settings:
            - setting_id: misp-canonical-url
              name: Canonical MISP URL
              value: https://misp.techvault.local
              provenance: runtime
              classification: plain
              description: Participant-visible HTTPS identity reported by MISP; the backend chooses how the selected component realizes it.
          authorization_ref: misp-api-authorization
          version: 2.5.44
      app_authorizations:
        - app_authorization_id: misp-api-authorization
          resource_vocabulary: app_resource
          auth_enabled: true
          principals:
            - principal_id: misp-administrator
              kind: user
              name: admin@admin.test
              credential_classification: operator_secret
              description: Operator-supplied MISP administrator identity; credential bytes are not pack content.
            - principal_id: misp-suricata-sync-api-key
              kind: api_key
              credential_classification: operator_secret
              description: The sync agent authenticates to MISP with a dedicated API key whose bytes are supplied through the backend's secret boundary.
          roles:
            - role_id: misp-administrator-role
              name: MISP administrator
            - role_id: misp-sync-reader-role
              name: MISP synchronization reader
          permission_grants:
            - grant_id: misp-administrator-access
              role_ref: misp-administrator-role
              resource_kind: app_resource
              actions: [manage]
              resource_patterns: ['*']
              effect: allow
            - grant_id: misp-sync-read-access
              role_ref: misp-sync-reader-role
              resource_kind: app_resource
              actions: [read]
              resource_patterns: [attributes/*, events/*]
              effect: allow
          role_mappings:
            - mapping_id: misp-administrator-mapping
              role_ref: misp-administrator-role
              users: [misp-administrator]
            - mapping_id: misp-sync-reader-mapping
              role_ref: misp-sync-reader-role
              users: [misp-suricata-sync-api-key]
  misp-db:
    type: compute
    os: linux
    services:
      - {name: mysql, port: 3306, protocol: tcp}
    runtime:
      service_listeners:
        - service_listener_id: mysql-listener
          service: mysql
          address: 0.0.0.0
          port: 3306
          protocol: tcp
          scope: wildcard
          provenance: operator
      database_services:
        - database_service_id: misp-db
          service: mysql
          engine: mariadb
          protocol: mysql
          listeners:
            - {address: 0.0.0.0, port: 3306}
          databases:
            - database_id: misp
              name: misp
              origin: scenario
          roles:
            - role_id: misp-application-role
              name: misp
              role_type: application
              origin: scenario
              can_login: true
              description: Application role used by MISP for its declared database.
          grants:
            - grantee_role_ref: misp-application-role
              object_type: database
              object_ref: misp
              privileges: [ALL]
              with_grant_option: false
              description: MISP owns its application database without grant delegation.
          version: "10.11"
  misp-redis:
    type: compute
    os: linux
    services:
      - {name: redis, port: 6379, protocol: tcp}
    runtime:
      service_listeners:
        - service_listener_id: redis-listener
          service: redis
          address: 0.0.0.0
          port: 6379
          protocol: tcp
          scope: wildcard
          provenance: operator
      datastore_services:
        - datastore_service_id: misp-redis
          service: redis
          engine: redis
          data_model: key_value
          protocol: redis
          nodes:
            - node_id: misp-redis-node
              endpoints:
                - endpoint_id: redis-client
                  role: client
                  protocol: redis
                  address: misp-redis
                  port: 6379
          persistence:
            persistence_id: misp-cache
            aof: false
            eviction: noeviction
            description: Ephemeral MISP cache with deterministic no-eviction behavior.
          authorization_ref: misp-redis-authorization
          version: "7"
      app_authorizations:
        - app_authorization_id: misp-redis-authorization
          resource_vocabulary: redis_acl
          auth_enabled: true
          principals:
            - principal_id: misp-cache-client
              kind: service_account
              credential_classification: redacted
              description: Backend-selected value-free credential used only by MISP for its cache service.
          roles:
            - role_id: misp-cache-role
              name: MISP cache read/write
          permission_grants:
            - grant_id: misp-cache-access
              role_ref: misp-cache-role
              resource_kind: redis_acl
              actions: [read, write]
              resource_patterns: ['*']
              effect: allow
          role_mappings:
            - mapping_id: misp-cache-client-mapping
              role_ref: misp-cache-role
              users: [misp-cache-client]
  misp-suricata-sync:
    type: compute
    os: linux
    services: []
    runtime:
      packages:
        - {manager: apt, name: python3-pip, version: "*"}
      dependency_manifests:
        - {ecosystem: pip, path: /app/pyproject.toml, name: aptl-labs}
      filesystem_inventory:
        - {path: /opt/techvault/soc-certs/lab-ca.pem, entry_type: file, owner_user: root, owner_group: root, mode: "0644", sensitivity: plain}
      # The persistent-volume declarations below are the single mount
      # authority for the generated rules and private command socket.
      forwarding_agents:
        - forwarding_agent_id: misp-ioc-to-suricata
          implementation: misp_suricata_sync
          agent_kind: content_sync
          description: Pulls tagged indicators from MISP, renders them into Suricata rules, and drives Suricata's command socket to reload. This is how threat intelligence becomes active network detection content.
          sources:
            - source_id: misp-attributes
              kind: api_pull
              location: https://misp.techvault.local
              parse_format: misp_json
              selector: techvault:enforce
          transforms:
            - transform_id: ioc-to-suricata-rules
              kind: ioc_to_rule
              sid_namespace: '99000000'
          settings:
            - setting_id: misp-api-authentication
              name: MISP API credential
              provenance: unknown
              classification: operator_secret
              description: Credential posture for the declared misp-suricata-sync-api-key principal; secret bytes are not pack content.
            - setting_id: misp-tls-verification
              name: MISP TLS certificate verification
              value: required
              provenance: default
              classification: plain
            - setting_id: misp-ca-trust-anchor
              name: MISP trusted CA certificate
              value: /opt/techvault/soc-certs/lab-ca.pem
              provenance: unknown
              classification: plain
          reload_channels:
            - reload_channel_id: suricata-command-socket
              target_ref: nodes.suricata.runtime.network_detection_engines.suricata-engine.control_channels.command-socket
              kind: unix_socket
  thehive:
    type: compute
    os: linux
    services:
      - {name: thehive-api, port: 9000, protocol: tcp}
    runtime:
      service_listeners:
        - service_listener_id: thehive-api-listener
          service: thehive-api
          address: 0.0.0.0
          port: 9000
          protocol: tcp
          scope: wildcard
          provenance: operator
      applications:
        - application_id: thehive-web
          service: thehive-api
          protocol: http
          routes:
            - route_id: thehive-root
              path: /
              methods: [GET]
              auth_required: true
      platform_applications:
