  # Full TechVault file-share loot tree. smb.conf advertises
  # Public/Engineering/Finance/HR/IT-Backups/Shared; the red-team exercise
  # mines the planted creds (engineering/deployments/deploy.sh), PII
  # (hr/employees/directory.csv), wifi passwords (shared/wifi-passwords.txt),
  # and a leaked deploy key in the IT-Backups share. The exact pack artifact
  # carries the fixture rather than relying on a checkout path.
  fileshare-shares:
    type: directory
    target: fileshare
    destination: /srv/shares
    source:
      name: techvault-fileshare-shares
      version: 0.1.0
