        - application_id: techvault-portal
          service: http
          protocol: http
          name: TechVault customer portal
          framework: flask
          base_path: /
          description: The internet-facing business application. Its weaknesses are the scenario content an attacker is meant to find.
          routes:
            - route_id: index
              path: /
              methods:
                - GET
              auth_required: false
              description: Public landing page.
            - route_id: login
              path: /login
              methods:
                - GET
                - POST
              auth_required: false
              description: Login form. It accepts intentionally vulnerable SQL input, and its error responses reveal internal detail.
            - route_id: logout
              path: /logout
              methods:
                - GET
              auth_required: true
              description: Ends the session.
            - route_id: dashboard
              path: /dashboard
              methods:
                - GET
              auth_required: true
              description: Authenticated user dashboard.
            - route_id: admin
              path: /admin
              methods:
                - GET
              auth_required: true
              description: Administrative view over stored backup configuration. /admin is reachable by any authenticated user and exposes stored cloud credentials.
            - route_id: upload
              path: /upload
              methods:
                - GET
                - POST
              auth_required: true
              description: File upload. Uploads are neither type- nor size-checked, and the filename allows traversal.
            - route_id: api-file
              path: /api/v1/files/<int:file_id>
              methods:
                - GET
              auth_required: true
              description: Fetch one file record. /api/v1/files/<id> performs no ownership check.
            - route_id: api-user
              path: /api/v1/users/<int:user_id>
              methods:
                - GET
              auth_required: true
              description: Fetch one user record. /api/v1/users/<id> performs no authorization check and returns an API key.
            - route_id: api-customers
              path: /api/v1/customers
              methods:
                - GET
              auth_required: true
              description: List customers.
            - route_id: api-token
              path: /api/v1/token
              methods:
                - POST
              auth_required: false
              description: Issue a bearer token. Tokens are signed with a guessable secret and never expire. The Flask session key and JWT secret are literals in the application source.
            - route_id: ping-tool
              path: /tools/ping
              methods:
                - GET
                - POST
              auth_required: true
              description: Network diagnostic helper. The /tools/ping host parameter reaches a shell without sanitization.
            - route_id: search
              path: /search
              methods:
                - GET
              auth_required: true
              description: Search users by name, email, or department. The query parameter is interpolated into SQL and rendered back into the page unescaped.
            - route_id: comment
              path: /comment
              methods:
                - POST
              auth_required: true
              description: Post a comment. Comment bodies are stored and rendered without sanitization.
            - route_id: debug
              path: /debug
              methods:
                - GET
              auth_required: false
              description: Debug information endpoint. /debug is reachable in the running application. The application serves its own .env content.
            - route_id: robots
              path: /robots.txt
              methods:
                - GET
              auth_required: false
              description: Robots file.
      forwarding_agents:
        - forwarding_agent_id: webapp-access-forwarder
          implementation: wazuh_agent
          version: 4.12.0
          agent_kind: log_forwarder
          name: techvault-webapp-agent
          description: Tails the customer portal access log and ships it to the Wazuh manager.
