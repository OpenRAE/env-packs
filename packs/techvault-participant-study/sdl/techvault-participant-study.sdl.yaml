  kali:
    type: compute
    os: linux
    services:
      - {name: ssh, port: 22, protocol: tcp}
    runtime:
      packages:
        - {manager: apt, name: openssh-server, version: "*"}
        # iputils-ping: reachability checks ICMP-ping every shared-network
        # host from kali. nmap: an nmap scan plus a failed SSH auth is the
        # representative event Suricata and Wazuh must correlate.
        - {manager: apt, name: iputils-ping, version: "*"}
        - {manager: apt, name: nmap, version: "*"}
        # python3 backs the Python offensive tooling below (python3-impacket,
        # sqlmap).
        - {manager: apt, name: python3, version: "*"}
        # Offensive toolset. The TechVault attack path uses these
        # enumeration and exploitation tools, and the web attacks
        # (SQLi/XSS/cmd-injection) are driven with curl. Kali metapackages
        # (kali-linux-core / kali-tools-top10, which carry metasploit) live in
        # the Kali apt repo rather than Debian, so this installs the
        # Debian-available subset the scenario actually exercises.
        - {manager: apt, name: curl, version: "*"}
        - {manager: apt, name: wget, version: "*"}
        - {manager: apt, name: dnsutils, version: "*"}
        - {manager: apt, name: netcat-openbsd, version: "*"}
        - {manager: apt, name: smbclient, version: "*"}
        - {manager: apt, name: ldap-utils, version: "*"}
        - {manager: apt, name: sqlmap, version: "*"}
        - {manager: apt, name: hydra, version: "*"}
        - {manager: apt, name: python3-impacket, version: "*"}
