  # dev-user's leaked SSH private key is the real workstation -> victim
  # lateral-movement pivot: the workstation pivot keypair from the
  # `techvault-ssh-keys` generated artifact, whose public half victim already
  # authorizes (victim-authorized-keys below). Placing its private half here as
  # dev-user's ~/.ssh/id_rsa makes `ssh -i ~/.ssh/id_rsa labadmin@victim` from
  # the compromised workstation work. The private key is generated per standup,
  # so no id_rsa or PEM secret ships in the pack.
