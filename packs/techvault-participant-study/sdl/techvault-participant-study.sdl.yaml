              ingestion_port: 1514
              protocol: tcp
            - target_id: webapp-agent-enrollment
              target_node_ref: wazuh-manager
              target_service_ref: agent-enrollment
              enrollment_port: 1515
              protocol: tcp
              enrollment_identity_classification: operator_secret
