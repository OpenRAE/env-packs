propositions:
  misp-authenticated-api-ready:
    description: MISP serves its canonical HTTPS identity and completes an authenticated API write and read through the declared MariaDB and Redis services.
    subjects:
      - nodes.misp.runtime.platform_applications.misp-threat-intelligence
      - nodes.misp-db.runtime.database_services.misp-db
      - nodes.misp-redis.runtime.datastore_services.misp-redis
    basis: observed_state
    quantifier: all
    predicate:
      kind: boolean
      property: misp-authenticated-api-ready
      semantic_ref: urn:techvault:observable:misp-authenticated-api-ready
      expected: true
    evidence_requirements: [misp-authenticated-api-readiness]
  wazuh-agents-ready:
    description: Each monitored host has one active, uniquely enrolled Wazuh identity and readable host-correlated telemetry, including after restart or recreation.
    subjects: [nodes.webapp, nodes.ad, nodes.dns, nodes.fileshare, nodes.victim, nodes.workstation, nodes.db, nodes.suricata]
    basis: observed_state
    quantifier: all
    predicate:
      kind: boolean
      property: wazuh-agent-ready
      semantic_ref: urn:techvault:observable:wazuh-agent-ready
      expected: true
    evidence_requirements: [wazuh-agent-readiness]
  cortex-enrichment-ready:
    description: The exact TechVault analyzer executes offline and TheHive reports its authenticated Cortex connector ready.
    subjects: [cortex, thehive]
    basis: observed_state
    predicate:
      kind: boolean
      property: cortex-enrichment-ready
      semantic_ref: urn:raes:observable:cortex-enrichment-ready
      expected: true
    evidence_requirements: [cortex-enrichment-readback]
  suricata-local-rules-ready:
    description: The exact TechVault local corpus passes native configuration validation and all 16 declared SIDs are loaded.
    subjects: [nodes.suricata.runtime.network_detection_engines.suricata-engine.rule_sources.techvault-local]
    basis: observed_state
    predicate:
      kind: boolean
      property: network-detection-rule-source-ready
      semantic_ref: urn:raes:observable:network-detection-rule-source-ready
      expected: true
    evidence_requirements: [suricata-local-rule-readiness]
  suricata-login-sqli-detected:
    description: A participant-equivalent SQL-injection request to the declared login route produces local SID 1000010 and Wazuh web-attack alert 303020.
    subjects: [nodes.suricata.runtime.network_detection_engines.suricata-engine.rule_sources.techvault-local]
    basis: observed_state
    predicate:
      kind: boolean
      property: network-detection-alert-sid-1000010-observed
      semantic_ref: urn:raes:observable:network-detection-alert-observed
      expected: true
    evidence_requirements: [suricata-login-sqli-alert]
assertions:
  misp-authenticated-api-ready:
    proposition: misp-authenticated-api-ready
    role: postcondition
  wazuh-agents-ready:
    proposition: wazuh-agents-ready
    role: precondition
  cortex-enrichment-ready:
    proposition: cortex-enrichment-ready
    role: postcondition
  suricata-local-rules-ready:
    proposition: suricata-local-rules-ready
    role: postcondition
  suricata-login-sqli-detected:
    proposition: suricata-login-sqli-detected
    role: postcondition
observation_boundaries:
  participant-cortex-enrichment-view:
    projection_basis: ordinary operator access through TheHive and Cortex APIs
    observable_refs: [nodes.cortex, nodes.thehive]
    redaction_policy: preserve analyzer identity and bounded result status while removing credentials
    latency_profile: available after Cortex reaches its declared ready state
evidence_requirements:
  misp-authenticated-api-readiness:
    description: Records bounded authenticated MISP, MariaDB, Redis, and TLS readiness results without configuration bodies or credential material.
    source_refs:
      - nodes.misp.runtime.platform_applications.misp-threat-intelligence
      - nodes.misp-db.runtime.database_services.misp-db
      - nodes.misp-redis.runtime.datastore_services.misp-redis
    scope_refs: [nodes.misp, nodes.misp-db, nodes.misp-redis]
    scope: >-
      On a clean realization, record the canonical MISP URL and certificate
      verification result, an authenticated API write/read result, the declared
      database identity and application-role access result, and authenticated
      Redis access with the declared cache policy. Missing, anonymous,
      substituted, stale, or contradictory state fails readiness. Report only
      bounded statuses, stable identities, and correlation ids; omit backend
      choices, credential values, and configuration bodies.
    boundary_kind: system_under_test
    channel: api_response
    media_types: [application/json]
    artifact_role: service_materialization_readback
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
  wazuh-agent-readiness:
    description: Per-host enrollment and telemetry readiness without enrollment credentials or raw log content.
    source_refs:
      - nodes.wazuh-manager.runtime.security_monitoring_managers.wazuh-manager
      - nodes.webapp.runtime.forwarding_agents.webapp-access-forwarder
      - nodes.ad.runtime.forwarding_agents.ad-samba-forwarder
      - nodes.dns.runtime.forwarding_agents.dns-query-forwarder
      - nodes.fileshare.runtime.forwarding_agents.fileshare-samba-forwarder
      - nodes.victim.runtime.forwarding_agents.victim-system-forwarder
      - nodes.workstation.runtime.forwarding_agents.workstation-system-forwarder
      - nodes.db.runtime.forwarding_agents.db-postgres-forwarder
      - nodes.suricata.runtime.forwarding_agents.suricata-eve-forwarder
    scope_refs: [nodes.webapp, nodes.ad, nodes.dns, nodes.fileshare, nodes.victim, nodes.workstation, nodes.db, nodes.suricata, nodes.wazuh-manager]
    scope: >-
      For each subject, correlate the declared forwarding agent with exactly one
      active manager member by its stable enrollment name and node reference.
      Missing, duplicate, stale or disconnected required identities fail readiness.
      Confirm readable declared log sources and fresh telemetry attributed to that
      identity before and after restart or recreation, preserving compatible
      enrollment. PostgreSQL and Suricata retain their own source ownership;
      Suricata EVE, generic syslog and manager health do not prove another host's
      endpoint-agent readiness. Report bounded identity/status/correlation results
      and loss; omit enrollment keys, credentials and raw event bodies.
    boundary_kind: system_under_test
    channel: file_artifact
    media_types: [application/json]
    artifact_role: service_materialization_readback
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
  cortex-enrichment-readback:
    description: Records the exact enabled analyzer identity, a successful bounded report for the scenario attacker IP, and TheHive's Cortex connector status without credentials or full report bodies.
    source_refs:
      - nodes.cortex.runtime.platform_applications.cortex-enrichment
      - nodes.thehive.runtime.platform_applications.thehive-case-management
    scope_refs: [nodes.cortex, nodes.thehive]
    scope: Exact analyzer inventory, successful TechVaultScenarioContext_1_0 execution for 172.20.1.30, and TheHive Cortex connector status OK.
    boundary_ref: participant-cortex-enrichment-view
    boundary_kind: system_under_test
    channel: api_response
    artifact_role: service_materialization_readback
    media_types: [application/json]
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
  suricata-local-rule-readiness:
    description: Records admitted content identities, configuration success, selected files, and the loaded 16-SID local corpus without recording rule bodies or host paths.
    source_refs:
      - nodes.suricata.runtime.network_detection_engines.suricata-engine.rule_sources.suricata-builtin
      - nodes.suricata.runtime.network_detection_engines.suricata-engine.rule_sources.techvault-local
    scope_refs:
      - nodes.suricata
      - content.suricata-config
      - content.suricata-local-rules
    scope: Exact content identities and realized-byte digests, Suricata configuration result, selected source paths, and active local SIDs and count.
    boundary_kind: system_under_test
    channel: log
    artifact_role: network_detection_rule_readiness
    media_types: [text/plain]
    sensitivity: plain
    redaction: redact_sensitive
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
  suricata-login-sqli-alert:
    description: Captures the exact EVE alert for local SID 1000010 and its Wazuh 303020 correlation after a participant-equivalent login SQL-injection request.
    source_refs:
      - nodes.suricata.runtime.network_detection_engines.suricata-engine.output_streams.eve-json
      - nodes.wazuh-manager.runtime.security_monitoring_managers.wazuh-manager.content_sets.suricata-rules
    scope_refs:
      - nodes.webapp.runtime.applications.techvault-portal
      - nodes.suricata.runtime.network_detection_engines.suricata-engine.rule_sources.techvault-local
    scope: A fresh Kali-to-webapp POST /login containing UNION SELECT must yield Suricata signature_id 1000010 and Wazuh rule id 303020; unrelated alerts and aggregate counts do not satisfy this requirement.
    trigger_ref: nodes.webapp.runtime.applications.techvault-portal
    boundary_kind: participant_equivalent
    channel: log
    artifact_role: network_detection_alert
    media_types: [application/x-ndjson]
    sensitivity: plain
    redaction: redact_sensitive
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
  redteam-session-transcript:
    description: >-
      Records the red team's interactive command-line activity, the commands issued and the responses returned, so research can reconstruct what the red team actually did.
    source_class: apparatus
    scope_refs:
      - nodes.kali
    scope: >-
      Every interactive shell session on the red-team workstation, with the commands issued and the responses returned, attributable to a session and ordered in time.
    window: the full run, from range readiness through teardown
    channel: participant_output
    artifact_role: participant_session_transcript
    media_types: [text/plain]
    sensitivity: plain
    redaction: redact_secrets
    integrity: chain_of_custody
    retention: run_lifetime
    loss_disclosure: required
# Realizable accounts: the deployment backend ensures these groups, users,
# memberships, and non-secret attributes on the resolved `ad` node and verifies
# them by read-after-write. Declares identity only (no password material); the
# concrete credential is generated inside the target provider and never crosses
# the SDL or run evidence. Accounts the AD provisioner also creates are
# reconciled rather than re-created, so the provisioner-owned weak passwords
# (the intentional attack surface) are preserved. This is a representative
# subset of the full weak/Kerberoastable/over-privileged roster.
