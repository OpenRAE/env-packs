# Stateful Wazuh prerequisites are authored RAES resources. The deployment
# backend materializes and verifies these before either consumer starts; the
# checked-in Compose service definitions are provider bindings, not the source
# of artifact, volume, or dependency intent.
generated_artifacts:
  wazuh-indexer-certs:
    generator: certificate_bundle
    lifecycle: reuse_valid
    provenance: techvault:wazuh-indexer-certificate-profile/v1
    outputs:
      - {name: root-ca, path: root-ca.pem, sensitivity: public}
      - {name: indexer-key, path: wazuh.indexer-key.pem, sensitivity: secret}
      - {name: indexer-cert, path: wazuh.indexer.pem, sensitivity: public}
    consumers:
      - node: wazuh-indexer
        mount_destination: /usr/share/wazuh-indexer/certs
        access_mode: read_only
        selected_outputs: [root-ca, indexer-key, indexer-cert]
  wazuh-manager-certs:
    generator: certificate_bundle
    lifecycle: reuse_valid
    provenance: techvault:wazuh-manager-certificate-profile/v1
    outputs:
      - {name: manager-root-ca, path: root-ca-manager.pem, sensitivity: public}
      - {name: manager-key, path: wazuh.manager-key.pem, sensitivity: secret}
      - {name: manager-cert, path: wazuh.manager.pem, sensitivity: public}
    consumers:
      - node: wazuh-manager
        mount_destination: /etc/ssl/wazuh
        access_mode: read_only
        selected_outputs: [manager-root-ca, manager-key, manager-cert]
  wazuh-dashboard-certs:
    generator: certificate_bundle
    lifecycle: reuse_valid
    provenance: techvault:wazuh-dashboard-certificate-profile/v1
    outputs:
      - {name: root-ca, path: root-ca.pem, sensitivity: public}
      - {name: dashboard-key, path: wazuh.dashboard-key.pem, sensitivity: secret}
      - {name: dashboard-cert, path: wazuh.dashboard.pem, sensitivity: public}
    consumers:
      - node: wazuh-dashboard
        mount_destination: /usr/share/wazuh-dashboard/certs
        access_mode: read_only
        selected_outputs: [root-ca, dashboard-key, dashboard-cert]
  wazuh-manager-config:
    generator: rendered_config
    lifecycle: regenerate_on_change
    provenance: techvault:wazuh-manager-config-profile/v1
    outputs:
      - {name: manager-config, path: wazuh_manager.conf, sensitivity: secret}
    consumers:
      - node: wazuh-manager
        mount_destination: /wazuh-config-mount/etc/ossec.conf
        access_mode: read_only
        selected_outputs: [manager-config]
    ordering_dependencies: [generated_artifacts.wazuh-manager-certs]

  # Backend-produced access material replaces the seven former content.source
  # entries that pointed at standup-generated APTL paths. The operator private
  # key remains inside the producer. Each node receives only the output subset
  # needed for its declared SSH path; no private key is copied into this pack.
  techvault-ssh-keys:
    generator: ssh_key_bundle
    lifecycle: regenerate_on_change
    provenance: techvault:ssh-access-profile/v1
    outputs:
      - name: operator-private-key
        path: operator/control-plane-key
        sensitivity: secret
        disposition: producer_private
      - name: workstation-dev-private-key
        path: dev-user/.ssh/id_rsa
        sensitivity: secret
      - name: workstation-dev-public-key
        path: dev-user/.ssh/id_rsa.pub
        sensitivity: public
      - name: workstation-pivot-private-key
        path: labadmin/.ssh/id_ed25519
        sensitivity: secret
      - name: target-authorized-keys
        path: labadmin/.ssh/authorized_keys
        sensitivity: restricted
      - name: kali-authorized-keys
        path: kali/.ssh/authorized_keys
        sensitivity: restricted
      - name: kali-pivot-private-key
        path: kali/.ssh/kali_pivot_key
        sensitivity: secret
    consumers:
      - node: workstation
        mount_destination: /home
        access_mode: read_only
        selected_outputs:
          - workstation-dev-private-key
          - workstation-dev-public-key
          - workstation-pivot-private-key
          - target-authorized-keys
      - node: victim
        mount_destination: /home
        access_mode: read_only
        selected_outputs: [target-authorized-keys]
      - node: kali
        mount_destination: /home
        access_mode: read_only
        selected_outputs: [kali-authorized-keys, kali-pivot-private-key]

  # The SOC trust chain is separate from Wazuh's certificate bundles. Its CA
  # private key is producer-private, while each service selects only the public
  # CA and its own leaf/keystore material.
  techvault-soc-certificates:
    generator: certificate_bundle
    lifecycle: reuse_valid
    provenance: techvault:soc-certificate-profile/v1
    outputs:
      - name: ca-private-key
        path: lab-ca.key
        sensitivity: secret
        disposition: producer_private
      - name: ca-certificate
        path: lab-ca.pem
        sensitivity: public
      - name: misp-certificate
        path: misp/server.pem
        sensitivity: public
      - name: misp-private-key
        path: misp/server.key
        sensitivity: secret
      - name: thehive-keystore
        path: thehive/keystore.p12
        sensitivity: restricted
      - name: thehive-keystore-password
        path: thehive/keystore.p12.password
        sensitivity: secret
      - name: shuffle-certificate
        path: shuffle-frontend/server.pem
        sensitivity: public
      - name: shuffle-private-key
        path: shuffle-frontend/server.key
        sensitivity: secret
    consumers:
      - node: misp
        mount_destination: /opt/aptl/soc-certs
        access_mode: read_only
        selected_outputs: [ca-certificate, misp-certificate, misp-private-key]
      - node: thehive
        mount_destination: /opt/aptl/soc-certs
        access_mode: read_only
        selected_outputs: [ca-certificate, thehive-keystore, thehive-keystore-password]
      - node: cortex
        mount_destination: /opt/aptl/soc-certs
        access_mode: read_only
        selected_outputs: [ca-certificate]
      - node: shuffle-frontend
        mount_destination: /opt/aptl/soc-certs
        access_mode: read_only
        selected_outputs: [ca-certificate, shuffle-certificate, shuffle-private-key]

  # Per-node flag signing keys are backend-produced and never ship as pack
  # bytes. The producer retains its seed; each node receives only its own key,
  # and the scoring backend can validate the corresponding aptl:v2 HMAC token.
  techvault-flag-signing-keys:
    generator: rendered_config
    lifecycle: regenerate_on_change
    provenance: techvault:flag-signing-profile/v2
    outputs:
      - name: signing-seed
        path: internal/signing-seed
        sensitivity: secret
        disposition: producer_private
      - name: victim-signing-key
        path: victim.key
        sensitivity: secret
      - name: workstation-signing-key
        path: workstation.key
        sensitivity: secret
      - name: webapp-signing-key
        path: webapp.key
        sensitivity: secret
      - name: fileshare-signing-key
        path: fileshare.key
        sensitivity: secret
    consumers:
      - node: victim
        mount_destination: /run/techvault/flag-signing
        access_mode: read_only
        selected_outputs: [victim-signing-key]
      - node: workstation
        mount_destination: /run/techvault/flag-signing
        access_mode: read_only
        selected_outputs: [workstation-signing-key]
      - node: webapp
        mount_destination: /run/techvault/flag-signing
        access_mode: read_only
        selected_outputs: [webapp-signing-key]
      - node: fileshare
        mount_destination: /run/techvault/flag-signing
        access_mode: read_only
        selected_outputs: [fileshare-signing-key]

persistent_volumes:
  wazuh-indexer-data:
    lifecycle: retain
    access_mode: read_write_once
    consumers:
      - node: wazuh-indexer
        mount_destination: /var/lib/wazuh-indexer
