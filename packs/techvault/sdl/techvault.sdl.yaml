name: techvault
description: >
  Operational RAES projection for the TechVault range. This SDL is the public
  startup contract: it names the steady-state Compose services and networks
  that `aptl lab start` realizes. There is no separate captured deep
  per-asset inventory behind it (ADR-046).

nodes:
  security-net:
    type: switch
    description: SOC and security tooling network.
  dmz-net:
    type: switch
    description: TechVault DMZ network.
  internal-net:
    type: switch
    description: Internal enterprise target network.
  redteam-net:
    type: switch
    description: Red-team operations network.
  control-net:
    type: switch
    description: >-
      Control network carrying operator access to the range: the Kali SSH proxy
      and the web application proxy attach here alongside their range-facing
      networks. Not internal, so the host can reach the published proxy ports.

  wazuh-manager:
    type: vm
    os: linux
    source:
      name: "wazuh/wazuh-manager"
      version: "4.12.0"
      artifact_requirement:
        requirement_id: wazuh-manager-image
        explicitness: exact
        exact_artifact:
          artifact_id: "wazuh/wazuh-manager"
          version: "4.12.0"
          digest: "sha256:dea2fa1e6d5062147b6a85b241f5f501c5f1ba4b817d12bda06f7870a89ad561"
          media_type: "application/vnd.docker.distribution.manifest.v2+json"
        permitted_routes:
          - mechanism:
              mechanism: "exact-artifact"
              profile: "aptl-oci-exact-pull"
              version: "1"
              digest: "sha256:041966e3e607d90c1237bdbbf1a7a8b48de397ea134405094318f41521b8dfea"
            acquisition: pull
            timing: backend-preparation
    services:
      - {name: wazuh-api, port: 55000, protocol: tcp}
      - {name: agent-events, port: 1514, protocol: tcp}
      - {name: agent-enrollment, port: 1515, protocol: tcp}
      - {name: syslog, port: 514, protocol: udp}
    runtime:
      environment:
        - name: INDEXER_URL
          value: "https://wazuh-indexer:9200"
        - name: INDEXER_USERNAME
          value: ""
          value_classification: operator_secret
        - name: INDEXER_PASSWORD
          value: ""
          value_classification: operator_secret
        - name: FILEBEAT_SSL_VERIFICATION_MODE
          value: "full"
        - name: SSL_CERTIFICATE_AUTHORITIES
          value: "/etc/ssl/wazuh/root-ca-manager.pem"
        - name: SSL_CERTIFICATE
          value: "/etc/ssl/wazuh/wazuh.manager.pem"
        - name: SSL_KEY
          value: "/etc/ssl/wazuh/wazuh.manager-key.pem"
        - name: API_USERNAME
          value: ""
          value_classification: operator_secret
        - name: API_PASSWORD
          value: ""
          value_classification: operator_secret
      security_monitoring_managers:
        - security_monitoring_manager_id: wazuh-manager
          implementation: wazuh
          manager_kind: siem
          version: 4.12.0
          name: TechVault SIEM
          description: The scenario's SIEM. Agents enroll here, ship events here, and the analysis engine evaluates them against the rule corpora below.
          listeners:
            - listener_id: agent-events
              service: agent-events
              role: agent_event_ingestion
              protocol: tcp
              auth_required: true
              tls_enabled: false
            - listener_id: agent-enrollment
              service: agent-enrollment
              role: agent_enrollment
              protocol: tcp
              auth_required: true
              tls_enabled: true
            - listener_id: syslog
              service: syslog
              role: syslog_ingestion
              protocol: udp
              auth_required: false
              tls_enabled: false
            - listener_id: wazuh-api
              service: wazuh-api
              role: api
              protocol: tcp
              auth_required: true
              tls_enabled: true
          components:
            - component_id: analysisd
              kind: analysis_engine
              name: wazuh-analysisd
              enabled: true
            - component_id: remoted
              kind: agent_ingestion
              name: wazuh-remoted
              enabled: true
            - component_id: authd
              kind: agent_enrollment
              name: wazuh-authd
              enabled: true
            - component_id: apid
              kind: api
              name: wazuh-apid
              enabled: true
            - component_id: indexer-forwarder
              kind: indexer_forwarder
              name: filebeat
              enabled: true
          agents:
            - agent_id: suricata-agent
              name: aptl-suricata-agent
              node_ref: wazuh-sidecar-suricata
              description: Ships Suricata EVE events; see that node's forwarding agent.
            - agent_id: db-agent
              name: aptl-db-agent
              node_ref: wazuh-sidecar-db
              description: Ships PostgreSQL logs; see that node's forwarding agent.
          content_sets:
            - content_id: webapp-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: webapp_rules.xml
              file_count: 11
              loaded: true
              description: Web-application attack rules, including the SQL-injection detections the range exercises.
            - content_id: suricata-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: suricata_rules.xml
              file_count: 12
              loaded: true
              description: Rules that fire on Suricata EVE events arriving from the network sensor.
            - content_id: ad-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: ad_rules.xml
              file_count: 11
              loaded: true
              description: Active Directory authentication and abuse rules.
            - content_id: database-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: database_rules.xml
              file_count: 7
              loaded: true
              description: Customer-database access and abuse rules.
            - content_id: falco-rules
              kind: rule_corpus
              format: wazuh_rule_xml
              name: falco_rules.xml
              file_count: 8
              loaded: true
              description: Container runtime rules.
            - content_id: postgresql-decoders
              kind: decoder_corpus
              format: wazuh_decoder_xml
              name: postgresql_decoders.xml
              file_count: 2
              loaded: true
              description: Decoders that make PostgreSQL log lines parseable by the rules.
            - content_id: samba-decoders
              kind: decoder_corpus
              format: wazuh_decoder_xml
              name: samba_decoders.xml
              file_count: 2
              loaded: true
              description: Decoders for Samba file-share activity.
          detection_definitions:
            - definition_id: sqli-special-characters
              engine: wazuh
              definition_kind: rule
              native_id: '302011'
              content_set_ref: webapp-rules
              level: 8
              enabled: true
              loaded: true
              name: 'Potential SQL injection: special characters in URL'
              description: The detection the range's SQL-injection path is expected to trigger. Named here because the scenario depends on it firing, not merely on the corpus being loaded.
              groups:
                - webapp
                - sqli
                - web_attack
            - definition_id: sqli-union-select
              engine: wazuh
              definition_kind: rule
              native_id: '302010'
              content_set_ref: webapp-rules
              level: 10
              enabled: true
              loaded: true
              name: SQL injection attempt detected in URL
              groups:
                - webapp
                - sqli
                - web_attack
  wazuh-indexer:
    type: vm
    os: linux
    source:
      name: "wazuh/wazuh-indexer"
      version: "4.12.0"
      artifact_requirement:
        requirement_id: wazuh-indexer-image
        explicitness: exact
        exact_artifact:
          artifact_id: "wazuh/wazuh-indexer"
          version: "4.12.0"
          digest: "sha256:3691b3b27658695aad0c6879b412a001caf233ebbc1a5ba15647053aa03a2299"
          media_type: "application/vnd.docker.distribution.manifest.v2+json"
        permitted_routes:
          - mechanism:
              mechanism: "exact-artifact"
              profile: "aptl-oci-exact-pull"
              version: "1"
              digest: "sha256:041966e3e607d90c1237bdbbf1a7a8b48de397ea134405094318f41521b8dfea"
            acquisition: pull
            timing: backend-preparation
    services:
      - {name: indexer-api, port: 9200, protocol: tcp}
    runtime:
      environment:
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
      datastore_services:
        - datastore_service_id: wazuh-indexer
          engine: opensearch
          data_model: search_index
          version: 4.12.0
          description: Alert store for the SIEM. Alert indices are created on first ingest; the templates that shape them exist from boot.
          partitions:
            - partition_id: kibana
              kind: index
              name: .kibana_1
              shard_count: 1
              replica_count: 0
            - partition_id: security
              kind: index
              name: .opendistro_security
              shard_count: 1
              replica_count: 0
            - partition_id: observability
              kind: index
              name: .opensearch-observability
              shard_count: 1
              replica_count: 0
            - partition_id: ml-config
              kind: index
              name: .plugins-ml-config
              shard_count: 1
              replica_count: 0
          templates:
            - template_id: wazuh-agent
              name: wazuh-agent
            - template_id: wazuh-statistics
              name: wazuh-statistics
          mappings:
            - mapping_id: kibana-objects
              name: .kibana_1
              partition_ref: kibana
              top_level_field_count: 28
              description: Saved-object mapping for the dashboard tier.
  wazuh-dashboard:
    type: vm
    os: linux
    source:
      name: "wazuh/wazuh-dashboard"
      version: "4.12.0"
      artifact_requirement:
        requirement_id: wazuh-dashboard-image
        explicitness: exact
        exact_artifact:
          artifact_id: "wazuh/wazuh-dashboard"
          version: "4.12.0"
          digest: "sha256:8f5b50fde67a0b1c4d2321aa26b12bbc5cef21269cf4f6225746f0b946458bd7"
          media_type: "application/vnd.docker.distribution.manifest.v2+json"
        permitted_routes:
          - mechanism:
              mechanism: "exact-artifact"
              profile: "aptl-oci-exact-pull"
              version: "1"
              digest: "sha256:041966e3e607d90c1237bdbbf1a7a8b48de397ea134405094318f41521b8dfea"
            acquisition: pull
            timing: backend-preparation
    services:
      - {name: dashboard, port: 5601, protocol: tcp}
    runtime:
      environment:
        - name: INDEXER_USERNAME
          value: ""
          value_classification: operator_secret
        - name: INDEXER_PASSWORD
          value: ""
          value_classification: operator_secret
        - name: DASHBOARD_USERNAME
          value: ""
          value_classification: operator_secret
        - name: DASHBOARD_PASSWORD
          value: ""
          value_classification: operator_secret
        - name: API_USERNAME
          value: ""
          value_classification: operator_secret
        - name: API_PASSWORD
          value: ""
          value_classification: operator_secret
        - name: WAZUH_API_URL
          value: "https://wazuh-manager"

  suricata:
    type: vm
    os: linux
    source:
      name: "jasonish/suricata"
      version: "sha256:d64c491f6eb5d03b6562d873b3c5303e4c17d5dc1d75b3761a68319f11527dc3"
      artifact_requirement:
        requirement_id: suricata-image
        explicitness: exact
        exact_artifact:
          artifact_id: "jasonish/suricata"
          version: "sha256:d64c491f6eb5d03b6562d873b3c5303e4c17d5dc1d75b3761a68319f11527dc3"
          digest: "sha256:d64c491f6eb5d03b6562d873b3c5303e4c17d5dc1d75b3761a68319f11527dc3"
          media_type: "application/vnd.docker.distribution.manifest.list.v2+json"
        permitted_routes:
          - mechanism:
              mechanism: "exact-artifact"
              profile: "aptl-oci-exact-pull"
              version: "1"
              digest: "sha256:041966e3e607d90c1237bdbbf1a7a8b48de397ea134405094318f41521b8dfea"
            acquisition: pull
            timing: backend-preparation
    services: []
    runtime:
      network_sensors:
        - network_sensor_id: suricata-sensor
          implementation: suricata
          sensor_kind: ids
          monitoring_posture: passive
          capture_mode: af_packet
          capture_interfaces:
            - any
          monitored_network_refs:
            - security-net
            - dmz-net
            - internal-net
            - redteam-net
          name: TechVault network sensor
          description: Watches range traffic passively. Its EVE output is what the Wazuh sidecar tails, so this is where network visibility enters the SOC.
      network_detection_engines:
        - network_detection_engine_id: suricata-engine
          implementation: suricata
          engine_kind: ids
          sensor_ref: suricata-sensor
          name: TechVault detection engine
          description: Evaluates captured traffic against its rule sources and writes EVE events. MISP-derived rules are reloaded here over the command socket.
          app_layer_protocols:
            - http
            - tls
            - dns
            - ssh
            - smb
            - smtp
            - ftp
          rule_sources:
            - source_id: suricata-builtin
              kind: built_in
              format: suricata_rule
              name: suricata.rules
              loaded: true
              description: Ruleset shipped with the engine image.
            - source_id: techvault-local
              kind: local
              format: suricata_rule
              name: local.rules
              rule_count: 16
              loaded: true
              description: Scenario-authored rules for TechVault-specific activity.
            - source_id: misp-iocs
              kind: ioc
              format: suricata_rule
              name: misp/misp-iocs.rules
              loaded: true
              generated_by: nodes.misp-suricata-sync.runtime.forwarding_agents.misp-ioc-to-suricata
              description: Written by the MISP sync agent, not authored here. This is the threat-intelligence feed becoming live detection content.
          network_sets:
            - set_id: home-net
              kind: home_net
              name: HOME_NET
              selector_values:
                - 172.20.0.0/16
              network_refs:
                - security-net
                - dmz-net
                - internal-net
                - redteam-net
                - control-net
              description: The range itself; everything outside it is EXTERNAL_NET.
          output_streams:
            - stream_id: eve-json
              format: eve_json
              path: /var/log/suricata/eve.json
              event_types:
                - alert
                - http
                - dns
                - tls
                - ssh
                - flow
                - stats
              enabled: true
              description: The file the Wazuh sidecar tails off the shared suricata_logs volume. This path is the detection-to-SIEM hand-off.
          control_channels:
            - channel_id: command-socket
              kind: unix_socket
              path: /var/run/suricata/suricata-command.socket
              capabilities:
                - rule_reload
              auth_required: false
              description: Where the MISP sync agent drives a reload after writing rules.
  misp:
    type: vm
    os: linux
    source:
      name: "ghcr.io/misp/misp-docker/misp-core"
      version: "sha256:0eaa4e423d5cd965b7b76aa5665e81d5c05a35bc46a4ffec2ca52e0cfe627e86"
      artifact_requirement:
        requirement_id: misp-image
        explicitness: exact
        exact_artifact:
          artifact_id: "ghcr.io/misp/misp-docker/misp-core"
          version: "sha256:0eaa4e423d5cd965b7b76aa5665e81d5c05a35bc46a4ffec2ca52e0cfe627e86"
          digest: "sha256:0eaa4e423d5cd965b7b76aa5665e81d5c05a35bc46a4ffec2ca52e0cfe627e86"
          media_type: "application/vnd.docker.distribution.manifest.list.v2+json"
        permitted_routes:
          - mechanism:
              mechanism: "exact-artifact"
              profile: "aptl-oci-exact-pull"
              version: "1"
              digest: "sha256:041966e3e607d90c1237bdbbf1a7a8b48de397ea134405094318f41521b8dfea"
            acquisition: pull
            timing: backend-preparation
    services:
      - {name: https, port: 443, protocol: tcp}
    runtime: {}
  misp-db:
    type: vm
    os: linux
    source:
      name: "mariadb"
      version: "sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350"
      artifact_requirement:
        requirement_id: misp-db-image
        explicitness: exact
        exact_artifact:
          artifact_id: "mariadb"
          version: "sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350"
          digest: "sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350"
          media_type: "application/vnd.oci.image.index.v1+json"
        permitted_routes:
          - mechanism:
              mechanism: "exact-artifact"
              profile: "aptl-oci-exact-pull"
              version: "1"
              digest: "sha256:041966e3e607d90c1237bdbbf1a7a8b48de397ea134405094318f41521b8dfea"
            acquisition: pull
            timing: backend-preparation
    services:
      - {name: mysql, port: 3306, protocol: tcp}
    runtime:
      environment:
        - {name: MYSQL_DATABASE, value: misp}
        - {name: MYSQL_USER, value: misp}
        - {name: MYSQL_PASSWORD, value: misp_db_password}
        - {name: MYSQL_ROOT_PASSWORD, value: misp_root_password}
  misp-redis:
    type: vm
    os: linux
    source:
      name: "redis"
      version: "sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99"
      artifact_requirement:
        requirement_id: misp-redis-image
        explicitness: exact
        exact_artifact:
          artifact_id: "redis"
          version: "sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99"
          digest: "sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99"
          media_type: "application/vnd.oci.image.index.v1+json"
        permitted_routes:
          - mechanism:
              mechanism: "exact-artifact"
              profile: "aptl-oci-exact-pull"
              version: "1"
              digest: "sha256:041966e3e607d90c1237bdbbf1a7a8b48de397ea134405094318f41521b8dfea"
            acquisition: pull
            timing: backend-preparation
    services:
      - {name: redis, port: 6379, protocol: tcp}
  misp-suricata-sync:
    type: vm
    os: linux
    services: []
    runtime:
      # Environment the pre-refactor component required. Names and
      # classification only: a secret value is supplied by the operator
      # environment through the existing secret boundary, never authored
      # here and never carried in realization DTOs, argv, or logs.
      environment:
        - name: MISP_URL
          value: "https://misp"
          value_classification: plain
          provenance: compose
        - name: MISP_API_KEY
          value_classification: operator_secret
          provenance: compose
        - name: MISP_VERIFY_SSL
          value_classification: plain
          provenance: compose
        - name: MISP_CA_CERT_PATH
          value_classification: plain
          provenance: compose
        - name: IOC_TAG_FILTER
          value: "aptl:enforce"
          value_classification: plain
          provenance: compose
        - name: SYNC_INTERVAL_SECONDS
          value: "300"
          value_classification: plain
          provenance: compose
        - name: RULES_OUT_PATH
          value: "/var/lib/suricata/rules/misp/misp-iocs.rules"
          value_classification: plain
          provenance: compose
        - name: SURICATA_SOCKET_PATH
          value: "/var/run/suricata/suricata-command.socket"
          value_classification: plain
          provenance: compose
        - name: SID_BASE
          value: "99000000"
          value_classification: plain
          provenance: compose
        - name: LOG_LEVEL
          value: "INFO"
          value_classification: plain
          provenance: compose
      packages:
        - {manager: apt, name: python3-pip, version: "*"}
      dependency_manifests:
        - {ecosystem: pip, path: /app/pyproject.toml, name: aptl-labs}
      # Shares suricata's rules volume (ADR-043): this service writes
      # misp-iocs.rules here for suricata to load, and the command socket to
      # trigger its reload. Both are Compose-managed named volumes suricata
      # (still Compose-realized) already mounts at the same paths.
      mounts:
        - {target: /var/run/suricata, source: suricata_command_socket, source_kind: volume}
        - {target: /var/lib/suricata/rules/misp, source: suricata_misp_rules, source_kind: volume}
      forwarding_agents:
        - forwarding_agent_id: misp-ioc-to-suricata
          implementation: misp_suricata_sync
          agent_kind: content_sync
          description: Pulls tagged indicators from MISP, renders them into Suricata rules, and drives Suricata's command socket to reload. This is how threat intelligence becomes active network detection content.
          sources:
            - source_id: misp-attributes
              kind: api_pull
              location: https://misp
              parse_format: misp_json
              selector: aptl:enforce
          transforms:
            - transform_id: ioc-to-suricata-rules
              kind: ioc_to_rule
              sid_namespace: '3000000'
          reload_channels:
            - reload_channel_id: suricata-command-socket
              target_ref: suricata
              kind: unix_socket
  thehive:
