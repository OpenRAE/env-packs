    consumers:
      - {node: kali-capture, mount_destination: /var/log/aptl/captures, access_mode: read_write}
  misp_config:
    lifecycle: retain
    access_mode: read_write_once
    consumers:
      - {node: misp, mount_destination: /var/www/MISP/app/Config, access_mode: read_write}
  misp_data:
    lifecycle: retain
    access_mode: read_write_once
    consumers:
      - {node: misp, mount_destination: /var/www/MISP/app/files, access_mode: read_write}
  misp_db_data:
    lifecycle: retain
    access_mode: read_write_once
    consumers:
      - {node: misp-db, mount_destination: /var/lib/mysql, access_mode: read_write}
  shuffle_data:
    lifecycle: retain
    access_mode: read_write_once
    consumers:
      - {node: shuffle-backend, mount_destination: /shuffle-database, access_mode: read_write}
  shuffle_opensearch_data:
    lifecycle: retain
    access_mode: read_write_once
    consumers:
      - {node: shuffle-opensearch, mount_destination: /usr/share/opensearch/data, access_mode: read_write}
  suricata_config_seed:
    lifecycle: retain
    access_mode: read_write_once
    consumers:
      - {node: suricata, mount_destination: /seed, access_mode: read_only}
  suricata_logs:
    lifecycle: retain
    access_mode: read_write_once
      # Suricata writes eve.json here and the Wazuh sidecar tails it read-only:
      # this volume is the telemetry hand-off between detection and shipping.
    consumers:
      - {node: suricata, mount_destination: /var/log/suricata, access_mode: read_write}
      - {node: wazuh-sidecar-suricata, mount_destination: /logs, access_mode: read_only}
  tempo_data:
    lifecycle: retain
