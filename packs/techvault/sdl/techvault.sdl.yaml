features:
  techvault-webapp-service:
    type: service
    source:
      name: aptl-webapp
      version: local
    description: TechVault vulnerable customer portal service.
  techvault-defensive-stack:
    type: service
    source:
      name: aptl-soc-stack
      version: local
    description: Wazuh, Suricata, MISP, TheHive, Cortex, and Shuffle services.

vulnerabilities:
  webapp-sqli-login:
    name: SQL injection in login
    description: Login form accepts intentionally vulnerable SQL input.
    technical: true
    class: CWE-89

# Realizable content (ADR-046 TechVault Operational Standup Addendum,
# issue #689): every entry here is either bounded inline text or a
# project-contained, checked-in source. No runtime-observed:, dataset, or
# captured-filesystem content is authored here — APTL does not carry a
# separate captured inventory as review evidence (ADR-046 Capture Inventory
# and Parity-Inventory Removal Addendum). Both entries land on the
# `fileshare` node, whose Compose service mounts the `fileshare_data`
# named volume the APTL content realization backend seeds at
# `aptl lab start`.
  webapp-sqli-search:
    name: SQL injection in search
    description: The /search query parameter is interpolated into SQL. This is the path the range's detection chain exercises.
    technical: true
    class: CWE-89
  webapp-cmdi-ping:
    name: Command injection in the ping tool
    description: The /tools/ping host parameter reaches a shell without sanitization.
    technical: true
    class: CWE-78
  webapp-xss-reflected:
    name: Reflected XSS in search results
    description: The search query is rendered back into the page unescaped.
    technical: true
    class: CWE-79
  webapp-xss-stored:
    name: Stored XSS in comments
    description: Comment bodies are stored and rendered without sanitization.
    technical: true
    class: CWE-79
  webapp-idor-files:
    name: IDOR on the file API
    description: /api/v1/files/<id> performs no ownership check.
    technical: true
    class: CWE-639
  webapp-idor-users:
    name: IDOR on the user API
    description: /api/v1/users/<id> performs no authorization check and returns an API key.
    technical: true
    class: CWE-639
  webapp-missing-authz-admin:
    name: Missing role check on the admin page
    description: /admin is reachable by any authenticated user and exposes stored cloud credentials.
    technical: true
    class: CWE-862
  webapp-weak-jwt:
    name: Weak JWT secret with no expiry
    description: Tokens are signed with a guessable secret and never expire.
    technical: true
    class: CWE-330
  webapp-hardcoded-secrets:
    name: Hardcoded application secrets
    description: The Flask session key and JWT secret are literals in the application source.
    technical: true
    class: CWE-798
  webapp-unrestricted-upload:
    name: Unrestricted file upload
    description: Uploads are neither type- nor size-checked, and the filename allows traversal.
    technical: true
    class: CWE-434
  webapp-debug-endpoint:
    name: Debug endpoint exposed
    description: /debug is reachable in the running application.
    technical: true
    class: CWE-489
  webapp-env-disclosure:
    name: Environment file disclosure
    description: The application serves its own .env content.
    technical: true
    class: CWE-538
  webapp-verbose-errors:
    name: Verbose error disclosure
    description: Error responses reveal internal detail.
    technical: true
    class: CWE-209
content:
  aptl-tempo-config:
    type: file
    target: aptl-tempo
    path: /etc/tempo/tempo.yaml
    text: |
      server:
        http_listen_port: 3200

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:

      ingester:
        max_block_duration: 5m

      compactor:
        compaction:
          block_retention: 72h

      storage:
        trace:
          backend: local
          wal:
            path: /var/tempo/wal
          local:
            path: /var/tempo/blocks
  wazuh-indexer-opensearch-config:
    type: file
    target: wazuh-indexer
    path: /usr/share/wazuh-indexer/opensearch.yml
    text: |
      network.host: "0.0.0.0"
      node.name: "wazuh.indexer"
      path.data: /var/lib/wazuh-indexer
      path.logs: /var/log/wazuh-indexer
      discovery.type: single-node
      http.port: 9200-9299
      transport.tcp.port: 9300-9399
      compatibility.override_main_response_version: true
      plugins.security.ssl.http.pemcert_filepath: /usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      plugins.security.ssl.http.pemkey_filepath: /usr/share/wazuh-indexer/certs/wazuh.indexer-key.pem
      plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/wazuh-indexer/certs/root-ca.pem
      plugins.security.ssl.transport.pemcert_filepath: /usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      plugins.security.ssl.transport.pemkey_filepath: /usr/share/wazuh-indexer/certs/wazuh.indexer-key.pem
      plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/wazuh-indexer/certs/root-ca.pem
      plugins.security.ssl.http.enabled: true
      plugins.security.ssl.transport.enforce_hostname_verification: false
      plugins.security.ssl.transport.resolve_hostname: false
      plugins.security.authcz.admin_dn:
      - "CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
      plugins.security.check_snapshot_restore_write_privileges: true
      plugins.security.enable_snapshot_restore_privilege: true
      plugins.security.nodes_dn:
      - "CN=wazuh.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
      plugins.security.restapi.roles_enabled:
      - "all_access"
      - "security_rest_api_access"
      plugins.security.system_indices.enabled: true
      plugins.security.system_indices.indices: [".opendistro-alerting-config", ".opendistro-alerting-alert*", ".opendistro-anomaly-results*", ".opendistro-anomaly-detector*", ".opendistro-anomaly-checkpoints", ".opendistro-anomaly-detection-state", ".opendistro-reports-*", ".opendistro-notifications-*", ".opendistro-notebooks", ".opensearch-observability", ".opendistro-asynchronous-search-response*", ".replication-metadata-store"]
      plugins.security.allow_default_init_securityindex: true
      cluster.routing.allocation.disk.threshold_enabled: false
  wazuh-dashboard-opensearch-config:
    type: file
    target: wazuh-dashboard
    path: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
    text: |
      server.host: 0.0.0.0
      server.port: 5601
      opensearch.hosts: https://wazuh-indexer:9200
      opensearch.ssl.verificationMode: certificate
      opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]
      opensearch_security.multitenancy.enabled: false
      opensearch_security.readonly_mode.roles: ["kibana_read_only"]
      server.ssl.enabled: true
      server.ssl.key: "/usr/share/wazuh-dashboard/certs/wazuh.dashboard-key.pem"
      server.ssl.certificate: "/usr/share/wazuh-dashboard/certs/wazuh.dashboard.pem"
      opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
      uiSettings.overrides.defaultRoute: /app/wz-home
  wazuh-dashboard-app-config:
    type: file
    target: wazuh-dashboard
    path: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    text: |
      hosts:
        - default:
            url: "https://wazuh-manager"
            port: 55000
            username: wazuh-wui
            password: "WazuhPass123!"
            run_as: false
  cortex-index-init-script:
    type: file
    target: cortex-index-init
    path: /usr/local/bin/cortex-index-init.sh
    text: |
      #!/bin/sh
      set -eu

      # Cortex 3.1.8 key auth performs exact Elasticsearch term queries against
      # these fields. Pre-create the index so dynamic mappings do not make them text.
      ES_URL="${CORTEX_ES_URL:-http://thehive-es:9200}"
      INDEX="${CORTEX_INDEX:-cortex_6}"
      MAPPING='{"mappings":{"properties":{"relations":{"type":"keyword"},"status":{"type":"keyword"},"key":{"type":"keyword"}}}}'

      if curl -sf "${ES_URL}/${INDEX}" >/dev/null; then
          mapping="$(curl -sf "${ES_URL}/${INDEX}/_mapping")"
          if printf '%s' "$mapping" | grep -q '"relations":{"type":"keyword"}' \
              && printf '%s' "$mapping" | grep -q '"status":{"type":"keyword"}' \
              && printf '%s' "$mapping" | grep -q '"key":{"type":"keyword"}'; then
              exit 0
          fi

          count="$(curl -sf "${ES_URL}/${INDEX}/_count" \
              | sed -n 's/.*"count":\([0-9][0-9]*\).*/\1/p')"
          if [ "${count:-0}" != "0" ]; then
              echo "ERROR: ${INDEX} already has documents but lacks keyword key-auth mappings" >&2
              exit 1
          fi

          curl -sf -X DELETE "${ES_URL}/${INDEX}" >/dev/null
      fi

      curl -sf -H "Content-Type: application/json" -X PUT "${ES_URL}/${INDEX}" -d "$MAPPING" >/dev/null
