  webapp:
    type: vm
    os: linux
    services:
      - {name: http, port: 8080, protocol: tcp}
    runtime:
      # Named volumes the pre-refactor component owned. Bind mounts of
      # project keys and certificates are not restated here: they are
      # already authored as content placements, which carry containment
      # and sensitivity handling a raw bind does not.
      mounts:
        - {target: /var/log/gunicorn, source: webapp_logs, source_kind: volume}
      # Environment the pre-refactor component required. Names and
      # classification only: a secret value is supplied by the operator
      # environment through the existing secret boundary, never authored
      # here and never carried in realization DTOs, argv, or logs.
      environment:
        - name: DB_HOST
          value: "172.20.2.11"
          value_classification: plain
          provenance: compose
        - name: DB_PORT
          value: "5432"
          value_classification: plain
          provenance: compose
        - name: DB_NAME
          value: "techvault"
          value_classification: plain
          provenance: compose
        - name: DB_USER
          value: "techvault"
          value_classification: plain
          provenance: compose
        - name: DB_PASSWORD
          value: "techvault_db_pass"
          value_classification: secret_fixture
          provenance: compose
        - name: FLASK_ENV
          value: "production"
          value_classification: plain
          provenance: compose
        - name: SIEM_IP
          value: "172.20.2.30"
          value_classification: plain
          provenance: compose
        - name: WAZUH_MANAGER
          value: "wazuh.manager"
          value_classification: plain
          provenance: compose
        - name: AGENT_NAME
          value: "aptl-webapp-agent"
          value_classification: plain
          provenance: compose
        - name: LOG_PATHS
          value: "/var/log/gunicorn/access.log"
          value_classification: plain
          provenance: compose
        - name: LOG_FORMAT
          value: "syslog"
          value_classification: plain
          provenance: compose
      packages:
        - {manager: apt, name: python3-flask, version: "*"}
        - {manager: apt, name: python3-gunicorn, version: "*"}
        - {manager: apt, name: python3-psycopg2, version: "*"}
        - {manager: apt, name: python3-jwt, version: "*"}
        # rsyslog forwards gunicorn's access log to the Wazuh manager's syslog
        # port (172.20.2.30:514) so webapp SQLi/XSS/cmd-injection fire rules
        # 302010/302020/302030. #581 parity: the v5.0.0 webapp ran an in-process
        # Wazuh agent for this; on the generic node we forward via syslog (the
        # manager accepts remote syslog on 514 from 172.20.0.0/16), which the
        # web-accesslog decoder + custom rules process identically.
        - {manager: apt, name: rsyslog, version: "*"}
        # aptl lab continuity-audit (src/aptl/core/continuity.py) execs
        # iptables here to revert blanket kali source-IP DROPs left by Wazuh
        # active response. The node already declares CAP_NET_ADMIN for that;
        # without the tool itself the audit cannot inspect or clear the chain.
        - {manager: apt, name: iptables, version: "*"}
      filesystem_inventory:
        - {path: /var/log/gunicorn, entry_type: directory}
      # aptl lab continuity-audit (src/aptl/core/continuity.py) execs
      # iptables against this node's INPUT chain to revert blanket kali
      # source-IP DROPs; that needs CAP_NET_ADMIN, which Docker's default
      # capability set does not grant.
      linux_capabilities:
        add: [CAP_NET_ADMIN]
      # webapp is a deliberate attack-surface target, reachable from other
      # machines on the LAN like the in-range red team (test_docker_compose_
      # port_bindings.py TARGET_SURFACES), not an operator/management
      # surface -- so it does NOT get a loopback ADR-034 published_ports
      # declaration here. Its own networks (aptl-dmz, aptl-internal) are
      # both internal: true (SAF-002), which Docker never routes host
      # traffic through regardless of host_ip; the docker-compose.yml
      # webapp-proxy service is the real host publication (issue #581).
      service_manager_units:
        - {unit_id: webapp, unit_name: webapp.service, enabled_state: enabled, active_state: active}
        # Per-boot CTF flags (#581 parity; see aptl-flaggen.sh content below).
        - {unit_id: aptl-flaggen, unit_name: aptl-flaggen.service, enabled_state: enabled, active_state: active}
        # Custom rsyslog unit (below): the stock rsyslog.service carries systemd
        # sandboxing (ProtectKernelTunables/RestrictNamespaces/...) that fails
        # 226/NAMESPACE under the materializer's restricted caps, and a drop-in
        # would need a daemon-reload the materializer does not run. A fresh unit
        # file loads on start (like webapp.service) with no sandboxing.
        - {unit_id: aptl-rsyslog, unit_name: aptl-rsyslog.service, enabled_state: enabled, active_state: active}
      applications:
        - application_id: techvault-portal
          service: http
          protocol: http
          name: TechVault customer portal
          framework: flask
          base_path: /
          description: The internet-facing business application. Its weaknesses are the scenario content an attacker is meant to find.
          routes:
            - route_id: index
              path: /
              methods:
                - GET
              auth_required: false
              description: Public landing page.
            - route_id: login
              path: /login
              methods:
                - GET
                - POST
              auth_required: false
              description: Login form.
              vulnerability_refs:
                - webapp-sqli-login
                - webapp-verbose-errors
            - route_id: logout
              path: /logout
              methods:
                - GET
              auth_required: true
              description: Ends the session.
            - route_id: dashboard
              path: /dashboard
              methods:
                - GET
              auth_required: true
              description: Authenticated user dashboard.
            - route_id: admin
              path: /admin
              methods:
                - GET
              auth_required: true
              description: Administrative view over stored backup configuration.
              vulnerability_refs:
                - webapp-missing-authz-admin
            - route_id: upload
              path: /upload
              methods:
                - GET
                - POST
              auth_required: true
              description: File upload.
              vulnerability_refs:
                - webapp-unrestricted-upload
            - route_id: api-file
              path: /api/v1/files/<int:file_id>
              methods:
                - GET
              auth_required: true
              description: Fetch one file record.
              vulnerability_refs:
                - webapp-idor-files
            - route_id: api-user
              path: /api/v1/users/<int:user_id>
              methods:
                - GET
              auth_required: true
              description: Fetch one user record.
              vulnerability_refs:
                - webapp-idor-users
            - route_id: api-customers
              path: /api/v1/customers
              methods:
                - GET
              auth_required: true
              description: List customers.
            - route_id: api-token
              path: /api/v1/token
              methods:
                - POST
              auth_required: false
              description: Issue a bearer token.
              vulnerability_refs:
                - webapp-weak-jwt
                - webapp-hardcoded-secrets
            - route_id: ping-tool
              path: /tools/ping
              methods:
                - GET
                - POST
              auth_required: true
              description: Network diagnostic helper.
              vulnerability_refs:
                - webapp-cmdi-ping
            - route_id: search
              path: /search
              methods:
                - GET
              auth_required: true
              description: Search users by name, email, or department.
              vulnerability_refs:
                - webapp-sqli-search
                - webapp-xss-reflected
            - route_id: comment
              path: /comment
              methods:
                - POST
              auth_required: true
              description: Post a comment.
              vulnerability_refs:
