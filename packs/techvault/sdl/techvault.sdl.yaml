  dns:
    type: vm
    os: linux
    services:
      - {name: dns, port: 53, protocol: udp}
    runtime:
      # Named volumes the pre-refactor component owned. Bind mounts of
      # project keys and certificates are not restated here: they are
      # already authored as content placements, which carry containment
      # and sensitivity handling a raw bind does not.
      mounts:
        - {target: /var/log/named, source: dns_logs, source_kind: volume}
      # Environment the pre-refactor component required. Names and
      # classification only: a secret value is supplied by the operator
      # environment through the existing secret boundary, never authored
      # here and never carried in realization DTOs, argv, or logs.
      environment:
        - name: WAZUH_MANAGER
          value: "wazuh.manager"
          value_classification: plain
          provenance: compose
        - name: AGENT_NAME
          value: "aptl-dns-agent"
          value_classification: plain
          provenance: compose
        - name: LOG_PATHS
          value: "/var/log/named/query.log,/var/log/named/default.log"
          value_classification: plain
          provenance: compose
        - name: LOG_FORMAT
          value: "syslog"
          value_classification: plain
          provenance: compose
      packages:
        # continuity-audit execs iptables here to revert active-response
        # DROPs; the node declares CAP_NET_ADMIN for it, so the tool must
        # be present or the audit cannot inspect or clear the chain.
        - {manager: apt, name: iptables, version: "*"}
        - {manager: apt, name: bind9, version: "*"}
        - {manager: apt, name: dnsutils, version: "*"}
      filesystem_inventory:
        - {path: /var/log/named, entry_type: directory, owner_user: bind, owner_group: bind}
      # aptl lab continuity-audit needs CAP_NET_ADMIN to revert blanket kali
      # source-IP DROPs on this node's INPUT chain (src/aptl/core/continuity.py).
      linux_capabilities:
        add: [CAP_NET_ADMIN]
      # Host port 5353 (53 is commonly already bound on the host by a local
      # resolver): both protocols, since DNS genuinely uses UDP for queries
      # and TCP for zone transfers / large responses. dns is a deliberate
      # attack-surface target like webapp (test_docker_compose_port_bindings.py
      # TARGET_SURFACES), so host_ip is explicit all-interfaces, not the
      # ADR-034 loopback default meant for operator/management surfaces
      # (issue #581). dns also sits on aptl-security (not internal: true),
      # so unlike webapp this publishes correctly without a proxy.
      network:
        published_ports:
          - {container_port: 53, protocol: tcp, host_port: 5353, host_ip: "0.0.0.0"}
          - {container_port: 53, protocol: udp, host_port: 5353, host_ip: "0.0.0.0"}
      service_manager_units:
        - {unit_id: named, unit_name: named.service, enabled_state: enabled, active_state: active}
      dns_services:
        - dns_service_id: techvault-dns
          implementation: bind
          service: dns
          description: Authoritative DNS for the range, forward and reverse.
          roles:
            - authoritative
          zones:
            - zone_id: techvault-local
              name: techvault.local
              kind: primary
              purpose: forward
              provenance: zone_file
              description: Forward zone naming the enterprise hosts.
            - zone_id: reverse-172-20
              name: 20.172.in-addr.arpa
              kind: primary
              purpose: reverse
              provenance: zone_file
              description: Reverse zone for the range address space.
