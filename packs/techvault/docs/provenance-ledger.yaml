schema_version: "environment-pack-provenance/v3"
pack:
  name: techvault
  title: "TechVault"
  version: 0.6.0

sources:
  - source_id: aptl-techvault
    name: "APTL operational TechVault ACES scenario"
    url: https://github.com/Brad-Edwards/aptl
    ref: 43f137450268f25615c07b9a24144540dfac3c34
    license: MIT
    usage: adapted
    attribution_required: true
    attribution: "Copyright (c) 2025 APTL Contributors; used under the MIT License."
    used: "Operational TechVault RAES SDL, onboarding content fixtures, Wazuh certificate topology input, Wazuh manager configuration input, Docker Compose runtime source with digest-pinned external image references, container build contexts, service configs, helper scripts, web/API image source, and Python service package source for MISP-to-Suricata synchronization. Paths and authority comments were adapted for a self-contained ACES scenario pack."
    excluded: "Captured runtime state, generated certificates, generated SSH private keys, Docker volumes, run archives, repository-local secrets, and repository root .env files were not copied."
    captured: "2026-07-20"
  - source_id: penumbra-pack-doctrine
    name: "Penumbra scenario-pack convention and build doctrine"
    url: https://github.com/autarchy-ai/penumbra-scenarios/tree/dev/scenarios
    license: proprietary
    usage: referenced
    attribution_required: false
    used: "Pack layout, maturity semantics, delivery-bundle projection, provenance, visibility boundaries, and golden-readiness requirements."
    excluded: "No alternate scenario semantics or local ACES schema were introduced."
    captured: "2026-07-20"

artifacts:
  - artifact_id: aptl-aces-sdl
    path: sdl/techvault.sdl.yaml
    classification: redistributable
    sources: [aptl-techvault]
    description: "APTL TechVault ACES definition adapted only for pack-contained paths and ACES/provider authority wording."
  - artifact_id: aptl-content
    path: assets/content/onboarding/
    classification: redistributable
    sources: [aptl-techvault]
    description: "Synthetic onboarding fixture directory referenced by the ACES content resource."
  - artifact_id: aptl-runtime-inputs
    path: assets/runtime/wazuh/
    classification: redistributable
    sources: [aptl-techvault]
    description: "Wazuh source inputs referenced by ACES generated-artifact provenance fields."
  - artifact_id: pack-documentation
    path: docs/
    classification: commercial-only
    sources: [aptl-techvault, penumbra-pack-doctrine]
    description: "Migration lineage, facilitation interpretation, maturity, and proof boundaries."
  - artifact_id: delivery-profiles
    path: profiles/
    classification: commercial-only
    sources: [aptl-techvault, penumbra-pack-doctrine]
    description: "Guided, unguided, purple-team, and demo documentation projections plus direct ACES validation."
  - artifact_id: participant-briefing
    path: assets/briefing/
    classification: commercial-only
    sources: [aptl-techvault, penumbra-pack-doctrine]
    description: "Participant-safe purple-team mission framing."
  - artifact_id: aptl-runtime-build-source
    path: build/aptl-runtime/
    classification: commercial-only
    sources: [aptl-techvault]
    description: "Pinned APTL Docker Compose runtime snapshot with digest-pinned external image references, container build contexts, service configs, helper scripts, web/API image source, and runtime package source."
  - artifact_id: techvault-build-lifecycle
    path: build/
    classification: commercial-only
    sources: [aptl-techvault, penumbra-pack-doctrine]
    description: "Launch, health, reset, cleanup, generated-state rendering, synthetic operator defaults, build contract validation, and live rehearsal harness for the pack-local runtime."
  - artifact_id: techvault-live-rehearsal-report
    path: docs/rehearsal-report-392.md
    classification: commercial-only
    sources: [penumbra-pack-doctrine]
    description: "Durable issue #392 automated live rehearsal report with isolated-host operational-profile setup, participant path, telemetry, reset, persistence, and cleanup evidence."
  - artifact_id: techvault-manual-walkthrough
    path: docs/walkthroughs/manual-participant-walkthrough.md
    classification: commercial-only
    sources: [aptl-techvault, penumbra-pack-doctrine]
    description: "Reusable command-by-command Kali participant procedure with separate lifecycle and observer planes."
  - artifact_id: techvault-manual-walkthrough-report
    path: docs/manual-participant-walkthrough-report-393.md
    classification: commercial-only
    sources: [penumbra-pack-doctrine]
    description: "Value-sparse issue #393 manual proof, defect/rerun record, red/blue comparison, reset, automated follow-up, and teardown evidence."

content_safety:
  no_real_malware: true
  no_real_third_party_targets: true
  no_real_credentials: true
  no_sensitive_data: true
  offensive_tooling_boundary: true
  notes: "The migrated files contain synthetic range identities, example mail addresses, placeholder configuration values, intentionally weak account attributes, and committed pack-local runtime credentials for the training range. Generated private keys, generated certificates, Docker volumes, run archives, real credentials, customer data, malware, exploit kits, and live targets are excluded."

review:
  status: approved
  gates:
    - gate_id: licensing
      status: approved
      notes: "APTL is MIT licensed and the exact source pin is recorded."
    - gate_id: attribution
      status: approved
      notes: "APTL contributor attribution and MIT usage are recorded in this ledger."
    - gate_id: sensitive-data
      status: approved
      notes: "Migrated content is synthetic or placeholder range configuration."
    - gate_id: offensive-tooling
      status: approved
      notes: "Kali and provider tooling remain operator-only commercial runtime source. Issue #393 proved the contained participant journey on an isolated host and independently verified teardown."
    - gate_id: customer-overlay
      status: not-applicable
      notes: "No customer overlay is present."
