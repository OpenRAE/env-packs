schema_version: "environment-pack-compatibility/v2"
pack:
  name: techvault
  title: "TechVault"
  version: 0.6.0
  status: golden
  provenance_ledger: docs/provenance-ledger.yaml
  source:
    requirement: null
    issues: [386, 387, 388, 389, 390, 391, 392, 393]
    upstream_references:
      - https://github.com/Brad-Edwards/aptl/blob/43f137450268f25615c07b9a24144540dfac3c34/scenarios/techvault-operational.sdl.yaml

artifact_boundaries:
  participant_visible:
    - {path: README.md, export: public}
    - {path: assets/briefing/, export: public}
    - {path: assets/content/, export: public}
    - {path: profiles/_shared/, export: commercial}
    - {path: profiles/guided/participant/, export: commercial}
    - {path: profiles/unguided/participant/, export: commercial}
  operator_only:
    - {path: build/, export: operator}
    - {path: assets/runtime/, export: operator}
    - {path: docs/golden-readiness-checklist.md, export: operator}
    - {path: docs/rehearsal-report-392.md, export: operator}
    - {path: docs/walkthroughs/manual-participant-walkthrough.md, export: operator}
    - {path: docs/manual-participant-walkthrough-report-393.md, export: operator}
    - {path: docs/topology-reference-triangle.md, export: operator}
    - {path: profiles/guided/operator/, export: commercial}
    - {path: profiles/purple-team/operator/, export: commercial}
    - {path: profiles/demo/operator/, export: commercial}
  oracle_only:
    - {path: sdl/techvault.sdl.yaml, export: private}
    - {path: docs/attack-path.md, export: private}
  commercial:
    - {path: build/README.md, export: commercial}
    - {path: build/rehearsal.py, export: commercial}
    - {path: build/validate_build.py, export: commercial}
    - {path: build/tests/, export: commercial}
    - {path: docs/concepts.md, export: commercial}
    - {path: docs/lineage.md, export: commercial}
    - {path: docs/provenance-ledger.yaml, export: commercial}
    - {path: profiles/README.md, export: commercial}
    - {path: profiles/bundles.yaml, export: commercial}
    - {path: profiles/validate_profiles.py, export: commercial}
    - {path: profiles/tests/, export: commercial}

runtime_profiles:
  - profile_id: operational
    status: supported
    provider: docker-compose
    description: Full TechVault topology authored by sdl/techvault.sdl.yaml and realized through the pinned pack-local APTL Docker Compose runtime; isolated-host automated and manual golden proof passed in issues 392 and 393.
    build:
      - {path: build/}
      - {path: build/aptl-runtime/}
    tests:
      - {path: build/tests/}
    walkthroughs:
      - {path: docs/walkthroughs/manual-participant-walkthrough.md}

delivery_bundles:
  - bundle_id: guided
    status: supported
    audience: guided
    manifest: {path: profiles/bundles.yaml}
    participant_paths: [{path: profiles/guided/participant/}]
    operator_paths: [{path: profiles/guided/operator/}]
    validation: [{path: profiles/validate_profiles.py}]
  - bundle_id: unguided
    status: supported
    audience: unguided
    manifest: {path: profiles/bundles.yaml}
    participant_paths: [{path: profiles/unguided/participant/}]
    validation: [{path: profiles/validate_profiles.py}]
  - bundle_id: purple-team
    status: supported
    audience: purple-team
    manifest: {path: profiles/bundles.yaml}
    operator_paths: [{path: profiles/purple-team/operator/}]
    validation: [{path: profiles/validate_profiles.py}]
  - bundle_id: demo
    status: supported
    audience: demo
    manifest: {path: profiles/bundles.yaml}
    operator_paths: [{path: profiles/demo/operator/}]
    validation: [{path: profiles/validate_profiles.py}]

platform_features: []

assets:
  - {asset_id: participant-briefing, path: assets/briefing/, visibility: participant, status: shipped}
  - {asset_id: participant-content, path: assets/content/, visibility: participant, status: shipped}
  - {asset_id: runtime-source, path: assets/runtime/, visibility: operator, status: shipped}
  - {asset_id: raes-sdl, path: sdl/techvault.sdl.yaml, visibility: oracle, status: shipped}
  - {asset_id: provenance-ledger, path: docs/provenance-ledger.yaml, visibility: commercial, status: shipped}
  - {asset_id: profile-bundles, path: profiles/, visibility: commercial, status: shipped}
  - {asset_id: build-lifecycle, path: build/, visibility: operator, status: shipped}
  - {asset_id: aptl-runtime-source, path: build/aptl-runtime/, visibility: operator, status: shipped}
  - {asset_id: automated-live-rehearsal, path: build/rehearsal.py, visibility: operator, status: shipped}
  - {asset_id: automated-live-rehearsal-report, path: docs/rehearsal-report-392.md, visibility: operator, status: shipped}
  - {asset_id: manual-participant-walkthrough, path: docs/walkthroughs/manual-participant-walkthrough.md, visibility: operator, status: shipped}
  - {asset_id: manual-participant-walkthrough-report, path: docs/manual-participant-walkthrough-report-393.md, visibility: operator, status: shipped}

operator_surfaces:
  - {surface_id: attack-path, path: docs/attack-path.md, role: facilitator, visibility: oracle, status: shipped}
  - {surface_id: golden-readiness, path: docs/golden-readiness-checklist.md, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: profile-validator, path: profiles/validate_profiles.py, role: validator, visibility: commercial, status: shipped}
  - {surface_id: build-launch, path: build/launch.sh, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: build-health, path: build/health-check.sh, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: build-reset, path: build/reset.sh, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: build-cleanup, path: build/cleanup.sh, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: live-rehearsal, path: build/rehearsal.py, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: live-rehearsal-report, path: docs/rehearsal-report-392.md, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: manual-walkthrough, path: docs/walkthroughs/manual-participant-walkthrough.md, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: manual-walkthrough-report, path: docs/manual-participant-walkthrough-report-393.md, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: build-validator, path: build/validate_build.py, role: validator, visibility: commercial, status: shipped}

validation:
  commands:
    - id: central-pack-contract
      command: raes-pack-validate --pack scenarios/techvault
      validates: [published-pack-contract, raes-sdl, profile-bundles]
    - id: central-pack-release
      command: raes-pack-release check --pack scenarios/techvault
      validates: [release-boundaries, participant-leak-scan]
    - id: techvault-profile-bundles
      command: python3 scenarios/techvault/profiles/validate_profiles.py validate
      validates: [aces-authority, delivery-bundles, participant-operator-split, compatibility-joins]
    - id: techvault-build
      command: python3 scenarios/techvault/build/validate_build.py validate
      validates: [aces-build-join, lifecycle-surfaces, env-boundary, generated-state-boundary]
    - id: techvault-live-rehearsal
      command: python3 scenarios/techvault/build/rehearsal.py run --isolated-docker-host
      validates: [live-golden-profile, participant-start, negative-gates, reset-persistence, cleanup-proof, rehearsal-report]
    - id: techvault-web-ui
      command: cd scenarios/techvault/build/aptl-runtime/web && npm ci && npm test
      validates: [operator-console, web-ui-tests]
    - id: scenario-content
      command: python3 scripts/ci/scenario_content_ci.py
      validates: [private-catalog-checks, validators, tests, node-tests, leak-scan]
  gates:
    - id: manifest-schema
      kind: schema
      paths:
        - {path: pack.compatibility.yaml}
        - {path: docs/provenance-ledger.yaml}
    - id: raes-sdl
      kind: schema
      paths:
        - {path: sdl/techvault.sdl.yaml}
    - id: profile-bundles
      kind: unit-test
      paths:
        - {path: profiles/bundles.yaml}
        - {path: profiles/validate_profiles.py}
        - {path: profiles/tests/test_profiles.py}
    - id: live-build-source
      kind: unit-test
      paths:
        - {path: build/validate_build.py}
        - {path: build/rehearsal.py}
        - {path: build/tests/test_build_contract.py}
        - {path: build/tests/test_rehearsal.py}
    - id: manual-walkthrough
      kind: manual-walkthrough
      paths:
        - {path: docs/walkthroughs/manual-participant-walkthrough.md}
        - {path: docs/manual-participant-walkthrough-report-393.md}
    - id: web-ui-tests
      kind: unit-test
      paths:
        - {path: build/aptl-runtime/web/package.json}
        - {path: build/aptl-runtime/web/package-lock.json}
        - {path: build/aptl-runtime/web/tests/}
