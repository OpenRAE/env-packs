[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raes-env-packs"
# Static version, bumped by release-please on release (ADR 0008).
version = "3.8.0"
description = "RAES environment-pack definition, schemas, template, and authoring/validation tooling."
readme = "README.md"
# Floor follows the pinned raes runtime dependency, which requires >=3.11
# (ADR 0011). SDL validation flows entirely through RAES, so this package tracks
# the RAES Python floor rather than restating one.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brad Edwards" }]
keywords = ["raes", "environment-pack", "cyber-range", "security"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# raes is a hard, exactly-pinned dependency (ADR 0011): SDL is validated
# *through RAES* (raes.parse_sdl_file), never a local restatement, and the
# gate is fail-closed, so RAES cannot be optional. The pin tracks the latest
# compatibility-tested RAES release -- currently the 3.x SDL contract corpus.
# While those contracts are `stability: draft`, advancing the pin requires
# compatibility tests against this package's validator and template, so a
# downstream consumer resolves exactly the RAES runtime this release was
# validated against.
dependencies = ["PyYAML>=6", "raes==3.3.0"]

[project.urls]
Homepage = "https://github.com/OpenRAE/env-packs"
Repository = "https://github.com/OpenRAE/env-packs"

[project.scripts]
raes-pack-check = "raes_env_packs.check:main"
raes-pack-catalog = "raes_env_packs.catalog:main"
raes-pack-validate = "raes_env_packs.content_ci:main"
raes-pack-release = "raes_env_packs.release:main"
raes-pack-new = "raes_env_packs.wizard:main"
raes-new-pack = "raes_env_packs.wizard:main"
raes-pack-issue-skeleton = "raes_env_packs.issue_skeleton:main"
raes-pack-kit = "raes_env_packs.kit_cli:main"
raes-pack-verify = "raes_env_packs.verify:main"
raes-pack-dist = "raes_env_packs.distribution:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raes_env_packs"]

[tool.hatch.build.targets.wheel.force-include]
"packs/techvault" = "raes_env_packs/resources/packs/techvault"

[tool.hatch.build.targets.sdist]
include = [
    "/src/raes_env_packs",
    "/packs/techvault",
    "/docs",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# Release automation (ADR 0008): release-please maintains a release PR that bumps
# [project].version and CHANGELOG.md from Conventional Commit history; merging it
# tags + publishes. No dynamic version, no hatch-vcs, no towncrier.
