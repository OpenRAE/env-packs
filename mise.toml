# Tool pins for the Go port (ADR 0047). `mise install` installs the versions
# below and verifies each download against the checksums in mise.lock.
min_version = "2026.10.2"

[settings]
exec_auto_install = false

[tools]
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:errata-ai/vale" = "3.25.1"
"go:github.com/avito-tech/go-mutesting/cmd/go-mutesting" = "v0.0.0-20261002081621-9ce5f731e321"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
