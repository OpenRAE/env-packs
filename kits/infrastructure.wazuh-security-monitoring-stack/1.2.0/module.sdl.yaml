name: wazuh-security-monitoring-stack
version: 1.2.0
description: Reusable static infrastructure for Wazuh security monitoring stack. Configures
  enrollment_group through the kit parameter contract.
module:
  id: infrastructure/wazuh-security-monitoring-stack
  version: 1.2.0
  parameters:
  - deployment_profile
  - service_label
  - enrollment_group
  exports:
    nodes:
    - manager
    - indexer
    - dashboard
    - internal_network
    content:
    - seed_inventory
    accounts:
    - monitoring_operator
    infrastructure:
    - internal_network
    - manager
    - indexer
    - dashboard
    relationships:
    - manager_depends_on_indexer
    - dashboard_depends_on_manager
    - dashboard_depends_on_indexer
  description: Composable Wazuh security monitoring stack infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: wazuh-security-monitoring-stack
  enrollment_group:
    type: string
    default: lab
nodes:
  manager:
    type: compute
    description: '${deployment_profile} profile for ${service_label} (Wazuh security monitoring
      stack). Configuration: ${enrollment_group}.'
    source:
      name: wazuh-manager
      version: '4'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 1514
      protocol: tcp
      name: events
      description: Declared events service surface.
    - port: 55000
      protocol: tcp
      name: api
      description: Declared api service surface.
  indexer:
    type: compute
    description: ${deployment_profile} profile for ${service_label} (Wazuh security monitoring
      stack).
    source:
      name: wazuh-indexer
      version: '4'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 9200
      protocol: tcp
      name: http
      description: Declared http service surface.
    runtime:
      applications:
      - application_id: indexer_surface
        service: http
        protocol: http
        name: Indexer surface
        routes:
        - route_id: primary
          path: /
          methods:
          - GET
          responses:
          - status_code: 200
            description: Declared primary response.
        - route_id: health
          path: /health
          methods:
          - GET
          responses:
          - status_code: 200
            description: Declared health response.
  dashboard:
    type: compute
    description: ${deployment_profile} profile for ${service_label} (Wazuh security monitoring
      stack).
    source:
      name: wazuh-dashboard
      version: '4'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 5601
      protocol: tcp
      name: http
      description: Declared http service surface.
    runtime:
      applications:
      - application_id: dashboard_surface
        service: http
        protocol: http
        name: Dashboard surface
        routes:
        - route_id: primary
          path: /
          methods:
          - GET
          responses:
          - status_code: 200
            description: Declared primary response.
        - route_id: health
          path: /health
          methods:
          - GET
          responses:
          - status_code: 200
            description: Declared health response.
  internal_network:
    type: switch
    description: Module-local network for the declared service nodes.
content:
  seed_inventory:
    type: dataset
    target: manager
    description: Benign infrastructure seed inventory for ${enrollment_group}.
    items:
    - name: manager_configuration
      display_name: Manager Configuration
      tags:
      - infrastructure
      - seed
      description: Declared manager configuration for this reusable service.
    - name: agent_group
      display_name: Agent Group
      tags:
      - infrastructure
      - seed
      description: Declared agent group for this reusable service.
    - name: index_pattern
      display_name: Index Pattern
      tags:
      - infrastructure
      - seed
      description: Declared index pattern for this reusable service.
    - name: dashboard_space
      display_name: Dashboard Space
      tags:
      - infrastructure
      - seed
      description: Declared dashboard space for this reusable service.
    format: application/json
    text: |
      {
        "manager_configuration": {
          "cluster_mode": "single-manager",
          "event_ingest": "enabled",
          "api_access": "internal"
        },
        "agent_group": {
          "assignment": "dynamic",
          "policy": "baseline-monitoring",
          "status": "active"
        },
        "index_pattern": {
          "pattern": "security-events-*",
          "time_field": "observed_at"
        },
        "dashboard_space": {
          "name": "security-operations",
          "visibility": "team"
        }
      }
accounts:
  monitoring_operator:
    username: monitoring-operator
    node: manager
    password_strength: strong
    description: Declared environment account; credential delivery remains backend-owned.
realization:
  constraints:
  - field_pointer: /nodes/manager
    concern: compute-substrate
    posture: open
  - field_pointer: /nodes/indexer
    concern: compute-substrate
    posture: open
  - field_pointer: /nodes/dashboard
    concern: compute-substrate
    posture: open
infrastructure:
  internal_network:
    count: 1
  manager:
    links:
    - internal_network
  indexer:
    links:
    - internal_network
  dashboard:
    links:
    - internal_network
relationships:
  manager_depends_on_indexer:
    type: depends_on
    source: manager
    target: indexer
    description: manager requires indexer as an internal service dependency.
  dashboard_depends_on_manager:
    type: depends_on
    source: dashboard
    target: manager
    description: dashboard requires manager as an internal service dependency.
  dashboard_depends_on_indexer:
    type: depends_on
    source: dashboard
    target: indexer
    description: dashboard requires indexer as an internal service dependency.
