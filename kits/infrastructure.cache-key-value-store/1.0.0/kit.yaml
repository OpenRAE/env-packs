- No cluster bus, live cache contents, or persistence readback is asserted.
license:
  expression: MIT
  redistribution: open
  attribution: OpenRAE contributors
tests:
- path: tests/composition.yaml
  kind: validate
- path: tests/composition.yaml
  kind: parameter-variation
- path: tests/composition.yaml
  kind: multi-kit
component_inventory:
- scope: unresolved
  authority: raes-source
