name: shuffle-automation-service
version: 1.2.0
description: Reusable static infrastructure for Shuffle automation service. Configures tenant_name
  through the kit parameter contract.
module:
  id: infrastructure/shuffle-automation-service
  version: 1.2.0
  parameters:
  - deployment_profile
  - service_label
  - tenant_name
  exports:
    nodes:
    - automation
    - storage
    - internal_network
    content:
    - seed_inventory
    accounts:
    - automation_operator
    infrastructure:
    - internal_network
    - automation
    - storage
    relationships:
    - automation_depends_on_storage
  description: Composable Shuffle automation service infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: shuffle-automation-service
  tenant_name:
    type: string
    default: operations
nodes:
  automation:
    type: compute
    description: '${deployment_profile} profile for ${service_label} (Shuffle automation service).
      Configuration: ${tenant_name}.'
    source:
      name: shuffle
      version: '2'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 3001
      protocol: tcp
      name: http
      description: Declared http service surface.
    runtime:
      applications:
      - application_id: automation_surface
        service: http
        protocol: http
        name: Automation surface
        routes:
        - route_id: primary
          path: /
          methods:
          - GET
          responses:
          - status_code: 200
            description: Declared primary response.
        - route_id: health
          path: /health
          methods:
          - GET
          responses:
          - status_code: 200
            description: Declared health response.
  storage:
    type: compute
    description: ${deployment_profile} profile for ${service_label} (Shuffle automation service).
    source:
      name: opensearch
      version: '2'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 9200
      protocol: tcp
      name: http
      description: Declared http service surface.
    runtime:
      applications:
      - application_id: storage_surface
        service: http
        protocol: http
        name: Storage surface
        routes:
        - route_id: primary
          path: /
          methods:
          - GET
          responses:
          - status_code: 200
            description: Declared primary response.
        - route_id: health
          path: /health
          methods:
          - GET
          responses:
          - status_code: 200
            description: Declared health response.
  internal_network:
    type: switch
    description: Module-local network for the declared service nodes.
content:
  seed_inventory:
    type: dataset
    target: automation
    description: Benign infrastructure seed inventory for ${tenant_name}.
    items:
    - name: tenant
      display_name: Tenant
      tags:
      - infrastructure
      - seed
      description: Declared tenant for this reusable service.
    - name: users
      display_name: Users
      tags:
      - infrastructure
      - seed
      description: Declared users for this reusable service.
    - name: application_integrations
      display_name: Application Integrations
      tags:
      - infrastructure
      - seed
      description: Declared application integrations for this reusable service.
    - name: storage_profile
      display_name: Storage Profile
      tags:
      - infrastructure
      - seed
      description: Declared storage profile for this reusable service.
    format: application/json
    text: |
      {
        "tenant": {
          "isolation": "logical",
          "data_retention_days": 30,
          "status": "active"
        },
        "users": [
          {
            "username": "analyst",
            "role": "analyst",
            "status": "active"
          },
          {
            "username": "operator",
            "role": "administrator",
            "status": "active"
          }
        ],
        "application_integrations": [
          {
            "name": "case-management",
            "direction": "outbound",
            "enabled": true
          }
        ],
        "storage_profile": {
          "engine": "opensearch",
          "replicas": 0,
          "snapshot": "daily"
        }
      }
accounts:
  automation_operator:
    username: automation-operator
    node: automation
    password_strength: strong
    description: Declared environment account; credential delivery remains backend-owned.
realization:
  constraints:
  - field_pointer: /nodes/automation
    concern: compute-substrate
    posture: open
  - field_pointer: /nodes/storage
    concern: compute-substrate
    posture: open
infrastructure:
  internal_network:
    count: 1
  automation:
    links:
    - internal_network
  storage:
    links:
    - internal_network
relationships:
  automation_depends_on_storage:
    type: depends_on
    source: automation
    target: storage
    description: automation requires storage as an internal service dependency.
