- No mandatory external authoring prerequisite; connect exported surfaces at the pack
  composition root as needed.
license:
  expression: MIT
  redistribution: open
  attribution: OpenRAE contributors
tests:
- path: tests/composition.yaml
  kind: validate
- path: tests/composition.yaml
  kind: parameter-variation
- path: tests/composition.yaml
  kind: multi-kit
component_inventory:
- scope: unresolved
