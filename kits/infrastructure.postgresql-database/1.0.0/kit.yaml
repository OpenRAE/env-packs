schema_version: environment-pack-kit/v1
id: infrastructure.postgresql-database
version: 1.0.0
title: PostgreSQL database
summary: Reusable postgresql database with domain-specific configuration, declared
  service surfaces, seeded objects, and pack-local integration material.
concern: data-workflow
released_at: '2026-08-01T00:00:00Z'
module:
  path: module.sdl.yaml
assets:
- source: assets/integration.md
  target: assets/kits/postgresql-database/integration.md
  visibility: operator
  artifact_id: integration-material
- source: assets/seed.yaml
  target: assets/kits/postgresql-database/seed.yaml
  visibility: operator
  artifact_id: seed-profile
resources:
  cpu_cores: 2
  memory_mib: 2048
  storage_mib: 4096
