schema_version: environment-pack-kit/v1
id: infrastructure.load-rehearsal-runner
version: 1.0.0
title: Load/rehearsal runner
summary: Reusable load/rehearsal runner with domain-specific configuration, declared
  service surfaces, seeded objects, and pack-local integration material.
concern: policy-operations
released_at: '2026-08-01T00:00:00Z'
module:
  path: module.sdl.yaml
assets:
- source: assets/integration.md
  target: assets/kits/load-rehearsal-runner/integration.md
  visibility: operator
  artifact_id: integration-material
- source: assets/seed.yaml
  target: assets/kits/load-rehearsal-runner/seed.yaml
  visibility: operator
  artifact_id: seed-profile
resources:
  cpu_cores: 2
  memory_mib: 2048
  storage_mib: 4096
  notes: Planning estimates only; realization sizing remains backend-owned.
prerequisites:
- kind: external
  id: workload-targets
  version: raes-3.2
  description: Select imported services as bounded workload targets.
limitations:
- Declares static infrastructure, seeded state, and integration surfaces only.
- Does not claim launch, readiness, traffic attachment, credential delivery, or runtime
  evidence.
- Select imported services as bounded workload targets.
license:
  expression: MIT
  redistribution: open
  attribution: OpenRAE contributors
tests:
- path: tests/composition.yaml
  kind: validate
- path: tests/composition.yaml
  kind: parameter-variation
- path: tests/composition.yaml
  kind: multi-kit
component_inventory:
- scope: unresolved
  authority: raes-source
  ref: /nodes/runner/source
  description: RAES carries the declared k6 stable source; immutable artifact selection
    remains unresolved until pack publication.
associated_artifact_manifest: associated-artifacts.json
