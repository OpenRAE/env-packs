limitations:
- Declares static infrastructure, seeded state, and integration surfaces only.
- Does not claim launch, readiness, traffic attachment, credential delivery, or runtime
  evidence.
- Add pack-level proxy-upstream relationships to imported application services.
license:
  expression: MIT
  redistribution: open
  attribution: OpenRAE contributors
tests:
- path: tests/composition.yaml
  kind: validate
- path: tests/composition.yaml
  kind: parameter-variation
- path: tests/composition.yaml
  kind: multi-kit
component_inventory:
- scope: unresolved
  authority: raes-source
  ref: /nodes/gateway/source
  description: RAES carries the declared traefik 3 source; immutable artifact selection
    remains unresolved until pack publication.
associated_artifact_manifest: associated-artifacts.json
