schema_version: environment-pack-kit/v1
id: infrastructure.reverse-proxy-api-gateway
version: 1.0.0
title: Reverse proxy/API gateway
summary: Reusable reverse proxy/api gateway with domain-specific configuration, declared
  service surfaces, seeded objects, and pack-local integration material.
concern: network-shared
released_at: '2026-08-01T00:00:00Z'
module:
  path: module.sdl.yaml
assets:
- source: assets/integration.md
  target: assets/kits/reverse-proxy-api-gateway/integration.md
  visibility: operator
  artifact_id: integration-material
- source: assets/seed.yaml
  target: assets/kits/reverse-proxy-api-gateway/seed.yaml
  visibility: operator
  artifact_id: seed-profile
resources:
  cpu_cores: 2
  memory_mib: 2048
  storage_mib: 4096
  notes: Planning estimates only; realization sizing remains backend-owned.
prerequisites:
- kind: external
  id: upstream-application
  version: raes-3.2
  description: Add pack-level proxy-upstream relationships to imported application
