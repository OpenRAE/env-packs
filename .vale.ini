# Prose rules for the Markdown files of this repository
# (docs/development/documentation-style-guide.md). `make prose` runs Vale,
# which mise.toml pins, on the Markdown files that a change adds or changes.
# DocTools is the shared doc-tools style. `make prose` copies it from the
# doc-tools package that mise.lock verifies, so this file has no Packages URL.
# EnvPacks holds the rules that only this repository uses.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = EnvPacks, DocTools
