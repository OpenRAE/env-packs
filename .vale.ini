# Prose rules for the Markdown files of this repository: the ASD-STE100
# limits that a tool can check (docs/development/documentation-style-guide.md).
# `make prose` runs Vale, which mise.toml pins, on the Markdown files that a
# change adds or changes.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = STE
