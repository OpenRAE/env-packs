$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://raes.dev/schemas/environment-pack-kit-catalog-v1.json"
title: RAES environment-pack infrastructure kit catalog projection
description: >
  Deterministic generated discovery projection over validated kit releases.
  This is not the environment-pack catalog, a backend profile, or a support
  verdict surface.
type: object
additionalProperties: false
required: [schema_version, entries]
properties:
  schema_version:
    type: string
    const: "environment-pack-kit-catalog/v1"
  entries:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - source
        - id
        - version
        - title
        - summary
        - concern
        - released_at
        - module
        - topology
        - required_imports
        - assets
        - resources
        - prerequisites
        - limitations
        - license
        - tests
        - component_inventory
      properties:
        source:
          type: object
          additionalProperties: false
          required: [id, revision]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9_.-]{0,126}[a-z0-9]$"
            revision:
              type: string
              minLength: 1
              maxLength: 512
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9.-]{0,126}[a-z0-9]$"
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        concern:
          type: string
          enum:
            - identity-domain
            - access-workstation
            - network-shared
            - collaboration-developer
            - data-workflow
            - ai-model
            - security-operations
            - policy-operations
        released_at:
          type: string
          format: date-time
        module:
          type: object
          additionalProperties: false
          required: [id, version, parameters, parameter_defaults, exports]
          properties:
            id:
              type: string
              minLength: 1
            version:
              type: string
              pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"
            parameters:
              type: array
              items: {type: string}
            parameter_defaults:
              type: object
              additionalProperties:
                type: [string, number, integer, boolean]
            exports:
              type: object
              additionalProperties:
                type: array
                uniqueItems: true
                items: {type: string, minLength: 1}
        topology:
          type: array
          items: {type: string}
        required_imports:
          type: array
          items: {$ref: "#/$defs/prerequisiteProjection"}
        assets:
          type: array
          items: {$ref: "#/$defs/asset"}
        resources:
          $ref: "#/$defs/resources"
        prerequisites:
          type: array
          items: {$ref: "#/$defs/prerequisite"}
        limitations:
          type: array
          items: {type: string, minLength: 1}
        license:
          $ref: "#/$defs/license"
        tests:
          type: array
          minItems: 1
          items: {$ref: "#/$defs/test"}
        component_inventory:
          type: array
          minItems: 1
          items: {$ref: "#/$defs/component"}
$defs:
  asset:
    type: object
    additionalProperties: false
    required: [source, target, visibility, artifact_id]
    properties:
      source: {type: string, minLength: 1}
      target: {type: string, minLength: 1}
      visibility:
        type: string
        enum: [participant, operator, restricted, public]
      artifact_id: {type: string, minLength: 1}
  resources:
    type: object
    additionalProperties: false
    required: [cpu_cores, memory_mib, storage_mib, notes]
    properties:
      cpu_cores: {type: integer, minimum: 1}
      memory_mib: {type: integer, minimum: 1}
      storage_mib: {type: integer, minimum: 1}
      notes: {type: string, minLength: 1}
  prerequisiteProjection:
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
  prerequisite:
    type: object
    additionalProperties: false
    required: [kind, id, version, description]
    properties:
      kind: {type: string, enum: [kit, external]}
      id: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
      description: {type: string, minLength: 1}
  license:
    type: object
    additionalProperties: false
    required: [expression, redistribution, attribution]
    properties:
      expression: {type: string, minLength: 1}
      redistribution:
        type: string
        enum: [open, redistributable, restricted]
      attribution: {type: string, minLength: 1}
  test:
    type: object
    additionalProperties: false
    required: [path, kind]
    properties:
      path: {type: string, minLength: 1}
      kind: {type: string, enum: [validate, parameter-variation, multi-kit]}
  component:
    type: object
    additionalProperties: false
    required: [scope, authority, ref, description]
    properties:
      scope: {type: string, enum: [shipped, pinned, external, unresolved]}
      authority:
        type: string
        enum:
          - raes-source
          - raes-artifact
          - upstream-sbom
          - author-declared-external
      ref: {type: string, minLength: 1}
      description: {type: string, minLength: 1}
