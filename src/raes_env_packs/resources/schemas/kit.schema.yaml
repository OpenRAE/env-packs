$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://raes.dev/schemas/environment-pack-kit-v1.json"
title: RAES environment-pack infrastructure kit manifest
description: >
  Closed pack-domain carrier for one catalog-owned infrastructure kit. RAES
  remains authoritative for the referenced module, parameters, exports,
  composition, source artifacts, trust, and lock records.
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - version
  - title
  - summary
  - concern
  - released_at
  - module
  - assets
  - resources
  - prerequisites
  - limitations
  - license
  - tests
  - component_inventory
  - associated_artifact_manifest
properties:
  schema_version:
    type: string
    const: "environment-pack-kit/v1"
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9.-]{0,126}[a-z0-9]$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"
  title:
    type: string
    minLength: 1
  summary:
    type: string
    minLength: 1
  concern:
    type: string
    enum:
      - identity-domain
      - access-workstation
      - network-shared
      - collaboration-developer
      - data-workflow
      - ai-model
      - security-operations
      - policy-operations
  released_at:
    type: string
    format: date-time
  module:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        type: string
        minLength: 1
  assets:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [source, target, visibility, artifact_id]
      properties:
        source:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
          pattern: "^(?:assets/(?:briefing|content|kits)/|docs/kits/)[A-Za-z0-9][A-Za-z0-9._/-]*$"
        visibility:
          type: string
          enum: [participant, operator, restricted, public]
        artifact_id:
          type: string
          minLength: 1
  resources:
    type: object
    additionalProperties: false
    required: [cpu_cores, memory_mib, storage_mib, notes]
    properties:
      cpu_cores:
        type: integer
        minimum: 1
      memory_mib:
        type: integer
        minimum: 1
      storage_mib:
        type: integer
        minimum: 1
      notes:
        type: string
        minLength: 1
  prerequisites:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, id, version, description]
      properties:
        kind:
          type: string
          enum: [kit, external]
        id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
  limitations:
    type: array
    items:
      type: string
      minLength: 1
  license:
    type: object
    additionalProperties: false
    required: [expression, redistribution, attribution]
    properties:
      expression:
        type: string
        minLength: 1
      redistribution:
        type: string
        enum: [open, redistributable, restricted]
      attribution:
        type: string
        minLength: 1
  tests:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path, kind]
      properties:
        path:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [validate, parameter-variation, multi-kit]
  component_inventory:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [scope, authority, ref, description]
      properties:
        scope:
          type: string
          enum: [shipped, pinned, external, unresolved]
        authority:
          type: string
          enum:
            - raes-source
            - raes-artifact
            - upstream-sbom
            - author-declared-external
        ref:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
  associated_artifact_manifest:
    type: string
    minLength: 1
