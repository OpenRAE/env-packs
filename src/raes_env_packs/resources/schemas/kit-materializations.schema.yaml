$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://raes.dev/schemas/environment-pack-kit-materializations-v1.json"
title: RAES environment-pack kit materialization and ownership ledger
description: >
  Inert authoring provenance for exact kit releases and explicit file owners.
  This is not a dependency lock, module descriptor, runtime API, or trust claim.
type: object
additionalProperties: false
required: [schema_version, materializations, files]
properties:
  schema_version:
    type: string
    const: "environment-pack-kit-materializations/v1"
  materializations:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - kit_id
        - kit_version
        - source
        - namespace
        - target_sdl
        - parameters
        - dependencies
        - module_path
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        kit_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9.-]{0,126}[a-z0-9]$"
        kit_version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"
        source:
          type: object
          additionalProperties: false
          required: [id, revision]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9_.-]{0,126}[a-z0-9]$"
            revision:
              type: string
              minLength: 1
              maxLength: 512
        namespace:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        target_sdl: {type: string, minLength: 1}
        parameters:
          type: object
          additionalProperties:
            type: [string, number, integer, boolean]
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, version]
            properties:
              id:
                type: string
                pattern: "^[a-z0-9][a-z0-9.-]{0,126}[a-z0-9]$"
              version:
                type: string
                pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$"
        module_path: {type: string, minLength: 1}
  files:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [path, baseline_digest, owners, artifact_id]
      properties:
        path: {type: string, minLength: 1}
        baseline_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owners:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        artifact_id: {type: string, minLength: 1}
