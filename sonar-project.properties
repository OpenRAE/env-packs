# SonarCloud Configuration
# https://sonarcloud.io/project/overview?id=OpenRAE_env-packs

sonar.projectKey=OpenRAE_env-packs
sonar.organization=raesystem

# Quality gate: make the scanner wait for the SonarCloud quality gate and fail
# the CI `sonar` job when the gate fails. Sonar is intentionally not a universal
# required context because repository secrets are unavailable to fork and
# Dependabot pull requests (ADR 0029); branch protection continues to require
# `verify`. The project's assigned gate must still be the strict gate that fails
# on any new issue (mirroring `raes-strict` on Brad-Edwards_aces); this file
# enforces the assigned gate whenever the scanner is eligible to run.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Source and test files. Python sources live under src/ and Python tests under
# tests/. Go sources and Go tests live in package directories across the
# repository (ADR 0047), so both roots are the repository root and the
# inclusion patterns select the files.
sonar.sources=.
sonar.inclusions=src/**,**/*.go
sonar.tests=.
sonar.test.inclusions=tests/**,**/*_test.go

# Exclusions
sonar.exclusions=\
  **/*_test.go,\
  **/testdata/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/build/**,\
  **/dist/**,\
  **/*.egg-info/**

# Match the CPython 3.14 range supported by RAES 9 and the package.
sonar.python.version=3.14

# Coverage. CI generates coverage.xml with coverage.py (see
# .github/workflows/ci.yml and .coveragerc); the scanner maps it onto the
# scripts/ sources.
sonar.python.coverage.reportPaths=coverage.xml

# Go coverage. The go CI job writes coverage-go.out with `make go-check` (see
# docs/development/go-test-standard.md), and the sonar job downloads it.
sonar.go.coverage.reportPaths=coverage-go.out
