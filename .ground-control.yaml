schema_version: 1
project: aces-scenario-packs
github_repo: RAESystem/env-packs
short_code: ASP
rules:
  # Injected into /implement planning so the workflow follows the repo's release
  # model (ADR 0006): conventional PR titles, never hand-bump a version, squash
  # features / merge dev->main. The required "Conventional PR title" check is the
  # hard gate; this makes the workflow produce conforming PRs.
  plan_rules: .gc/plan-rules.md
workflow:
  # These run the suite against the package's real dependencies, so they need an
  # interpreter that has them. AGENTS.md documents the setup as a venv with
  # `pip install -e .`, but a bare `python3` is whatever the caller's shell
  # resolves -- and an automated runner (CI, an agent workflow) does not activate
  # anything. Prefer a local .venv when one exists, and fall back to `python3`
  # otherwise, which is the CI case where the package is already installed.
  test_command: 'PY=$( [ -x .venv/bin/python ] && echo .venv/bin/python || echo python3 ); "$PY" -m unittest discover -s tests'
  completion_command: 'PY=$( [ -x .venv/bin/python ] && echo .venv/bin/python || echo python3 ); "$PY" -m unittest discover -s tests && PYTHONPATH=src "$PY" -m aces_scenario_packs.content_ci --repo . && PYTHONPATH=src "$PY" -m aces_scenario_packs.release check --all'
  # This repository has no separate policy tool -- no bin/policy, no rule engine.
  # Its repository policy is written as contract tests that assert the governance
  # invariants the ADRs commit to: supply-chain pinning (ADR 0004), least-privilege
  # workflow tokens and the scanning posture (ADR 0018), release provenance and tag
  # signing (ADR 0015, ADR 0017), the conventional-title rule that drives releases
  # (ADR 0006, ADR 0008), the docs publication contract, and the dev->main promotion
  # contract (ADR 0019). Declared explicitly because the default `make policy`
  # assumes a convention this repo does not follow. A new governance invariant
  # belongs in this list as well as in the suite.
  policy_command: 'PY=$( [ -x .venv/bin/python ] && echo .venv/bin/python || echo python3 ); "$PY" -m unittest tests.test_dependency_pinning tests.test_workflow_permissions tests.test_codeql_workflow tests.test_scorecard_workflow tests.test_release_workflow_attestation tests.test_release_workflow_tag_signing tests.test_pr_title_guard tests.test_readthedocs_config tests.test_makefile tests.test_ground_control_review_config'
  lint_command: python3 -m compileall src tests
  format_command: python3 -m compileall src tests
  # There is no pre-commit framework here -- no .pre-commit-config.yaml and no
  # installed hooks -- so the default `pre-commit run --all-files` has nothing to
  # run and fails. These are the checks this repo actually wants before a commit:
  # everything still byte-compiles, and no whitespace damage is introduced. The
  # substantive suites run at the completion and policy gates, not here.
  precommit_command: 'PY=$( [ -x .venv/bin/python ] && echo .venv/bin/python || echo python3 ); "$PY" -m compileall -q src tests && git diff --check HEAD'
  # /implement validates the PR title against these Conventional Commit types
  # (issue #896), matching the required "Conventional PR title" CI check. The type
  # drives the release bump (ADR 0006), so the workflow produces a conforming
  # title instead of failing the gate.
  pr_title:
    types: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
    require_scope: false
  # One pre-push Codex review cycle and one pre-push test-quality review cycle,
  # with automatic disposition of the review cap off so reaching a cap always
  # escalates to a human. These match Ground Control's current defaults; they are
  # declared explicitly so a future change to those defaults cannot silently alter
  # this repo's review posture.
  codex_review:
    pre_push_cap: 1
  test_quality_review:
    pre_push_cap: 1
  review_disposition:
    enabled: false
    mode: shadow
    max_auto_overrides: 0
    judge:
      enabled: false
docs:
  adr_dir: docs/decisions/adrs/
  workflow_reference: docs/scenario-packs.md
example_paths:
  source: src/aces_scenario_packs/
  test: tests/
requirements:
  uid_examples:
    - ASP-0001
    - ASP-0002
sonarcloud:
  project_key: Brad-Edwards_aces-scenario-packs
  organization: brad-edwards
architecture:
  vocabulary:
    patterns:
      - name: ACES-subordinate pack tooling
        applies_to: scenario-pack layout and authoring/validation/release tooling
        example_path: docs/scenario-packs.md
    boundary_contract:
      description: This repository is subordinate to ACES core (aces-sdl). ACES owns all scenario semantics (the SDL and its objectives, conditions, evidence, and participant/attacker behaviour); this repository owns only the scenario-pack layout and the authoring/validation/release tooling, and defines zero extensions to ACES semantics. It does not host actual scenario packs. See ADR 0009.
    binding_adrs: []
    anti_recommendations:
      - Do not host actual scenario packs here; this repo is the layout and tooling only.
      - Do not define or extend ACES semantics here (SDL, objectives, conditions, evidence, scoring, telemetry, oracle/validation models); consume them from ACES. See ADR 0009.
      - Do not encode downstream catalog vocabulary into canonical pack terminology.
