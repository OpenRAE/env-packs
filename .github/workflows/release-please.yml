name: Release Please

# Release automation (ADR 0008 + ADR 0017). Release Please runs in PR-only mode
# (skip-github-release: true in release-please-config.json): it maintains the
# "chore(main): release X.Y.Z" PR that bumps [project].version and CHANGELOG.md
# from the Conventional Commit history, but it never creates the tag or GitHub
# Release. Merging that PR to main is the release act; this workflow then detects
# the Release Please-owned version transition, creates a keyless-Sigstore-signed
# annotated tag, verifies it against the exact workflow identity, and only then
# builds, attests (ADR 0015), generates the SBOM (ADR 0004), publishes to PyPI
# via OIDC, and cuts the GitHub Release. No signing key is stored; nothing is
# hand-run; feature PRs never edit CHANGELOG.md.
#
# The release PR is opened by GITHUB_TOKEN, so required CI checks don't auto-run
# on it — admin-merge it (or give release-please a PAT so its checks run).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_pr:
        description: "Merged release PR to recover (for example, 135)"
        required: true
        type: string

# The canonical signer trust policy, declared once (ADR 0017). Referenced by the
# verification step; the ADR and SECURITY.md document the same values.
env:
  # Must match the repository's CURRENT path: the OIDC token's workflow ref is
  # issued for wherever the repo lives now, and GitHub's redirect for a
  # transferred repo does not apply to certificate-identity matching. After the
  # move to RAESystem/env-packs a stale value here fails `gitsign verify-tag`
  # closed, blocking every release (#142).
  CERT_IDENTITY: https://github.com/RAESystem/env-packs/.github/workflows/release-please.yml@refs/heads/main
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
  GITSIGN_VERSION_FLOOR: "0.15.0"
  # gitsign 0.16.1 cannot verify the Rekor entry it embeds in a newly signed
  # annotated tag (ADR 0024). Pin the last patched pre-regression release by
  # both version and published artifact digest until an upstream release passes
  # this repository's end-to-end tag-signing path.
  GITSIGN_VERSION_PIN: "0.15.1"
  GITSIGN_SHA256: 8712be2e5fe89c9728c50beed20f1d37340b9f2dc3306cfb8830ef975549e170

# Least privilege (#142): read-only workflow token. Every write this pipeline
# needs -- the release PR, the signed tag, the Release, OIDC, attestations -- is
# declared on the individual job that needs it, below. Scorecard penalizes a
# top-level write or an undeclared top level, not a scoped job-level write.
permissions: read-all

# Serialize releases so two runs cannot race to create or publish the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # PR-writing privilege only; no OIDC or attestation (ADR 0017 least-privilege).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please (PR-only mode)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  detect-release:
    name: Detect authorized release
    runs-on: ubuntu-latest
    # Read-only: inspect the merged PR + the version transition on the push.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      pr: ${{ steps.pr.outputs.number }}
      target: ${{ steps.pr.outputs.after }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # A normal push resolves the PR whose merge produced the push. An explicit
      # recovery names a previously merged main release PR whose publish run was
      # interrupted. Both paths feed the same authenticated label + version gate;
      # workflow_dispatch cannot select an arbitrary commit for publication.
      - name: Resolve the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          RECOVERY_PR: ${{ inputs.release_pr || '' }}
        run: |
          set -euo pipefail
          if [ -n "${RECOVERY_PR}" ]; then
            case "${RECOVERY_PR}" in
              *[!0-9]*)
                echo "release_pr must be a positive integer." >&2
                exit 1
                ;;
            esac
            api="repos/${GITHUB_REPOSITORY}/pulls/${RECOVERY_PR}"
            state="$(gh api "${api}" --jq '.state')"
            merged_at="$(gh api "${api}" --jq '.merged_at // ""')"
            base_ref="$(gh api "${api}" --jq '.base.ref')"
            if [ "${state}" != "closed" ] || [ -z "${merged_at}" ] || [ "${base_ref}" != "main" ]; then
              echo "Recovery requires a merged pull request into main." >&2
              exit 1
            fi
            after="$(gh api "${api}" --jq '.merge_commit_sha // ""')"
            git cat-file -e "${after}^{commit}"
            before="$(git rev-parse "${after}^")"
            gh api "${api}" --jq '.labels[].name' > pr-labels.txt
            number="${RECOVERY_PR}"
          else
            api="repos/${GITHUB_REPOSITORY}/commits/${PUSH_AFTER}/pulls"
            gh api "${api}" \
              --jq '[.[] | select(.merge_commit_sha == env.PUSH_AFTER) | .labels[].name] | .[]' \
              > pr-labels.txt || true
            number="$(gh api "${api}" \
              --jq 'map(select(.merge_commit_sha == env.PUSH_AFTER)) | (.[0].number // "" | tostring)' \
              || true)"
            before="${PUSH_BEFORE}"
            after="${PUSH_AFTER}"
          fi
          {
            echo "number=${number}"
            echo "before=${before}"
            echo "after=${after}"
          } >> "${GITHUB_OUTPUT}"

      # The gate authorizes on the release-PR label first, then parses
      # pyproject.toml + the manifest with real parsers as a consistency check,
      # validating strict SemVer + manifest agreement and failing closed on a
      # malformed transition (tools/release_tag_gate.py, guarded by unit tests).
      - name: Detect authorized release
        id: gate
        env:
          BEFORE_SHA: ${{ steps.pr.outputs.before }}
          AFTER_SHA: ${{ steps.pr.outputs.after }}
        run: |
          python tools/release_tag_gate.py check \
            --before "${BEFORE_SHA}" \
            --after "${AFTER_SHA}" \
            --merged-pr-labels-file pr-labels.txt \
            --github-output "${GITHUB_OUTPUT}"

  publish:
    name: Sign tag, build, attest, SBOM, and publish
    needs: [detect-release]
    if: needs.detect-release.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write        # push the signed tag + create/attach the Release
      id-token: write        # OIDC: gitsign signing identity + PyPI trusted publishing + attestation
      attestations: write    # sign SLSA build provenance for the dist artifacts (ADR 0015)
      pull-requests: write   # relabel the release PR autorelease: pending -> tagged
    env:
      TAG: ${{ needs.detect-release.outputs.tag }}
      VERSION: ${{ needs.detect-release.outputs.version }}
      TARGET_SHA: ${{ needs.detect-release.outputs.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.detect-release.outputs.target }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ADR 0024: install the last patched pre-regression gitsign release
      # directly from its upstream release asset and verify the published
      # SHA-256 before it can sign or verify anything.
      - name: Install digest-verified gitsign
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/gitsign"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "${binary}" \
            "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION_PIN}/gitsign_${GITSIGN_VERSION_PIN}_linux_amd64"
          printf '%s  %s\n' "${GITSIGN_SHA256}" "${binary}" \
            | sha256sum --check --strict
          chmod 0755 "${binary}"
          printf 'GITSIGN_BIN=%s\n' "${binary}" >> "${GITHUB_ENV}"

      # Defence in depth against CVE-2026-44310 (a verify-bypass fixed in 0.15.0):
      # fail closed if the installed gitsign is below the floor, regardless of how
      # it was installed.
      - name: Enforce gitsign version floor
        run: |
          set -euo pipefail
          installed="$("${GITSIGN_BIN}" version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [ -z "${installed}" ]; then
            echo "Could not determine the installed gitsign version." >&2
            exit 1
          fi
          lowest="$(printf '%s\n%s\n' "${installed}" "${GITSIGN_VERSION_FLOOR}" | sort -V | head -n1)"
          if [ "${lowest}" != "${GITSIGN_VERSION_FLOOR}" ]; then
            echo "gitsign ${installed} is below the required floor ${GITSIGN_VERSION_FLOOR} (CVE-2026-44310)." >&2
            exit 1
          fi
          echo "gitsign ${installed} satisfies the >= ${GITSIGN_VERSION_FLOOR} floor."

      # Create ONE signed annotated tag at the exact release commit, verify its
      # signature AND signer identity, and only then push it. Verification runs
      # before the tag is published and before any build/publish step, so an
      # unverifiable tag is never pushed (ADR 0017). A rerun reuses an existing
      # remote tag only when it dereferences to this commit and passes the same
      # identity policy; any other existing tag fails closed. Tags are never
      # deleted or force-updated. Auth for the push flows through the gh
      # credential helper (GH_TOKEN in env), never a remote URL or process arg.
      - name: Create, verify, and push the signed tag
        id: signed-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config gpg.x509.program "${GITSIGN_BIN}"
          git config gpg.format x509

          verify_tag() {
            for attempt in 1 2 3 4 5; do
              if "${GITSIGN_BIN}" verify-tag \
                --certificate-identity="${CERT_IDENTITY}" \
                --certificate-oidc-issuer="${CERT_OIDC_ISSUER}" \
                "${TAG}"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Signed tag verification failed after ${attempt} attempts." >&2
                return 1
              fi
              delay="$((attempt * 5))"
              echo "Transparency-log verification not ready; retrying in ${delay}s." >&2
              sleep "${delay}"
            done
          }

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; validating for rerun."
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            target="$(git rev-list -n 1 "${TAG}")"
            if [ "${target}" != "${TARGET_SHA}" ]; then
              echo "Existing tag ${TAG} points at ${target}, not ${TARGET_SHA}; refusing." >&2
              exit 1
            fi
            verify_tag
            echo "Reusing existing verified tag ${TAG}."
          else
            git tag -s "${TAG}" "${TARGET_SHA}" -m "Release ${TAG}"
            verify_tag
            printf 'verified=true\n' >> "${GITHUB_OUTPUT}"
            gh auth setup-git
            git push origin "refs/tags/${TAG}"
          fi

      # A historical release target can contain workflow files that differ from
      # main. GitHub refuses to let GITHUB_TOKEN push that tag even after the
      # signature verifies. Preserve the exact verified annotated-tag object for
      # one day so an operator can re-verify and push it with workflow-scoped
      # credentials, without storing a broad PAT in the repository (ADR 0025).
      - name: Export verified tag after a rejected push
        if: ${{ failure() && steps.signed-tag.outcome == 'failure' && steps.signed-tag.outputs.verified == 'true' }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/signed-release-tag"
          mkdir -p "${artifact_dir}"
          git cat-file -e "${TAG}^{tag}"
          git cat-file tag "${TAG}" > "${artifact_dir}/${TAG}.tag"
          git rev-parse "${TAG}^{tag}" > "${artifact_dir}/${TAG}.object-sha"
          git rev-list -n 1 "${TAG}" > "${artifact_dir}/${TAG}.target-sha"

      - name: Upload verified tag for manual recovery
        if: ${{ failure() && steps.signed-tag.outcome == 'failure' && steps.signed-tag.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-signed-tag-${{ needs.detect-release.outputs.tag }}
          path: ${{ runner.temp }}/signed-release-tag
          retention-days: 1
          if-no-files-found: error

      - name: Build sdist + wheel
        run: |
          # Hash-locked build tooling for reproducible, tamper-resistant
          # releases (#60, #142). --no-isolation is deliberate: the default
          # isolated build would resolve and download the hatchling backend at
          # build time, unpinned, defeating the lock. The backend is pinned in
          # requirements/build.txt and installed above instead.
          python -m pip install --require-hashes -r requirements/build.txt
          python -m build --no-isolation --outdir dist

      # ADR 0015: attest SLSA build provenance for the exact wheel + sdist just
      # built, before any publication (PyPI, GitHub Release), so each artifact
      # verifies with `gh attestation verify`. Release-blocking on failure.
      - name: Attest build provenance for wheel + sdist
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          # Hash-locked runtime closure + SBOM generator, then the just-built
          # wheel with --no-deps (#60, #142). Same resulting environment as the
          # previous single unpinned install, so the SBOM contents are unchanged.
          python -m pip install --require-hashes \
            -r requirements/runtime.txt -r requirements/sbom.txt
          python -m pip install --no-deps dist/*.whl
          mkdir -p sbom
          distribution="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          cyclonedx-py environment \
            --output-format JSON \
            --output-file "sbom/${distribution}.cdx.json"

      # Release notes come from the Release Please-owned CHANGELOG.md section for
      # this version, passed to gh by file (never interpolated into a command).
      - name: Extract release notes
        run: |
          python tools/release_tag_gate.py notes \
            --version "${VERSION}" \
            --changelog CHANGELOG.md \
            --output release-notes.md

      # Idempotent: a rerun after a later publication failure must not abort here
      # because the Release already exists. Reuse the existing Release for the
      # already-verified tag, or create it from the signed tag when absent.
      - name: Create the GitHub Release from the signed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; reusing it (rerun-safe)."
          else
            gh release create "${TAG}" \
              --verify-tag \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Attach dist + SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" dist/* sbom/*.cdx.json --clobber

      # Complete Release Please's state machine only after every publication
      # destination succeeds. Until then the pending label deliberately keeps
      # later release PRs blocked and workflow_dispatch can retry this exact PR.
      - name: Mark the release PR tagged
        if: needs.detect-release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.detect-release.outputs.pr }}
        run: |
          set -euo pipefail
          gh pr edit "${PR}" --add-label "autorelease: tagged"
          gh pr edit "${PR}" --remove-label "autorelease: pending" 2>/dev/null || true

  resume-release-please:
    name: Resume release PR maintenance
    needs: [publish]
    if: github.event_name == 'workflow_dispatch' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please after recovery
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
