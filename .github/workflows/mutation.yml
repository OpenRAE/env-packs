# Mutation testing on each Go file (ADR 0047).
#
# The go-mutation job of ci.yml mutates only the lines that a pull request
# changes. This weekly run mutates each Go file that is not a test file, so it
# finds a survivor that a removed or weakened test leaves in unchanged code. It
# reports the mutation score of each package, and each record in mutation.yaml
# that matches no mutant, because such a record is stale
# (docs/development/go-test-standard.md).
name: Mutation

on:
  schedule:
    # Weekly, Thursday 05:43 UTC. Off the top of the hour (GitHub delays runs
    # queued at :00) and on a day without codeql.yml (Mon), scorecard.yml (Tue),
    # and fuzz.yml (Wed).
    - cron: "43 5 * * 4"
  workflow_dispatch:

# Least privilege: mutation testing only reads the repository.
permissions: read-all

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-mutation-all:
    name: Mutation testing on each Go file
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the pinned go-mutesting
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.2
          install_args: go:github.com/avito-tech/go-mutesting/cmd/go-mutesting
          cache: false

      - name: Run mutation testing on each Go file
        run: make go-mutation-all
