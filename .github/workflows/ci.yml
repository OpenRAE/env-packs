name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

# Least privilege (#142): CI only reads the repository. SonarCloud authenticates
# with SONAR_TOKEN, not GITHUB_TOKEN, so no job here needs a write scope. An
# undeclared top level inherits the repository default and is scored as excessive
# by Scorecard's Token-Permissions check.
permissions: read-all

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          # Hash-locked dependency closure and build backend first, then the
          # package itself, so nothing unpinned can enter the environment (#142).
          # A version pin alone still trusts whatever artifact the index serves.
          #
          # --no-build-isolation is load-bearing, not noise: an editable install
          # is still a PEP 517 build, and the default isolated build downloads
          # pyproject's build-system requirement (hatchling) unpinned into a
          # throwaway env. --no-deps does not cover that. The backend comes from
          # the hash-locked requirements/build.txt instead.
          python -m pip install --require-hashes \
            -r requirements/runtime.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Dependency vulnerability audit
        run: |
          # Hash-locked audit tool for reproducible CI runs (#60, #142).
          python -m pip install --require-hashes -r requirements/pip-audit.txt
          # Retry: the advisory API is network-dependent, so a transient blip
          # should not fail the build. A real vulnerability fails all attempts.
          for i in 1 2 3; do
            if pip-audit; then exit 0; fi
            echo "pip-audit attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "pip-audit failed after 3 attempts"
          exit 1

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Environment-pack-content gate
        run: raes-pack-validate --repo .

      - name: Pack release gate
        run: raes-pack-release check --all

  sonar:
    runs-on: ubuntu-latest
    needs: [verify]
    # SonarCloud needs SONAR_TOKEN, which GitHub withholds from PRs that don't
    # carry repository secrets: forks and Dependabot PRs (Dependabot runs read a
    # separate secret store that this token isn't in). Skip both — the scan still
    # runs on the post-merge push to dev/main with full token access, so the
    # quality gate covers the integrated code. Dependency bumps don't touch
    # sonar.sources (src/) anyway, so there is nothing new to analyze here.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate coverage report
        run: |
          # Hash-locked runtime + coverage + build backend, then the package
          # (#142). `coverage` was previously unversioned entirely, and
          # --no-build-isolation keeps the editable install's PEP 517 build from
          # fetching hatchling unpinned.
          python -m pip install --require-hashes \
            -r requirements/runtime.txt -r requirements/coverage.txt \
            -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
          coverage run -m unittest discover -s tests
          coverage xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
