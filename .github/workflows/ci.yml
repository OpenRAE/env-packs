name: CI

# Pull requests run CI whatever their base branch is. The Go port (ADR 0047)
# lands on the go-cutover branch, and a pull request that needs an unmerged
# chunk uses that chunk's branch as its base. Every such pull request must show
# the complete check result before review.
on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - go-cutover

# Least privilege (#142): CI only reads the repository. SonarCloud authenticates
# with SONAR_TOKEN, not GITHUB_TOKEN, so no job here needs a write scope. An
# undeclared top level inherits the repository default and is scored as excessive
# by Scorecard's Token-Permissions check.
permissions: read-all

# Cancel a superseded run on the same ref so a fresh push does not queue behind
# the commit it replaces (mirrors codeql.yml, fuzz.yml, scorecard.yml). This
# shortens time-to-feedback under runner contention; the new head's run carries
# the complete gate, so nothing verified is lost (#163).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Topology (issue #163, ADR 0029): the required protected-branch context is the
# `verify` job, kept stable so branch protection needs no change. It no longer
# does the work itself -- it is a fail-closed aggregate of the mandatory jobs
# (`compile`, `tests`, `audit`, `content`, `docs`) that now run concurrently. The
# `docs` job builds the public documentation warning-strict and joins the gate
# (ADR 0030). `sonar`
# consumes the `tests` job's same-run coverage artifact instead of re-running the
# suite, and depends only on that producer. Repo-wide security invariants
# (action SHA pinning, read-only permissions, hash-locked pip shapes, no
# auto-merge) are enforced across every workflow by tests/test_workflow_permissions.py
# and tests/test_dependency_pinning.py; the topology here is guarded by
# tests/test_ci_topology.py.
jobs:
  # Earliest possible feedback: byte-compile the tree with no dependency install
  # at all, so a syntax error fails in seconds rather than after a full setup.
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Compile sources and tests
        run: python -m compileall src tests

  # The unit-test authority and the single coverage producer. It runs the suite
  # under coverage once and publishes coverage.xml for the `sonar` job, so the
  # suite is never executed twice (ADR 0029).
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          # Cache pip downloads keyed on the exact hash-locked files this job
          # installs. Restores still pass through --require-hashes verification,
          # so the cache cannot introduce an unpinned or tampered artifact (#163).
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/coverage.txt
            requirements/build.txt

      - name: Install package with coverage tooling
        run: |
          # Hash-locked runtime + coverage + build backend, then the package
          # (#142). `coverage` was previously unversioned entirely, and
          # --no-build-isolation keeps the editable install's PEP 517 build from
          # fetching hatchling unpinned.
          python -m pip install --require-hashes \
            -r requirements/runtime.txt -r requirements/coverage.txt \
            -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run unit tests with coverage
        run: |
          # `coverage run` propagates the unittest exit code, so a failing test
          # fails this job just as a bare `unittest discover` would; coverage xml
          # then renders the report .coveragerc scopes to src/raes_env_packs.
          coverage run -m unittest discover -s tests
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          # A missing report is a defect, not an empty upload: fail loudly so the
          # sonar job never scans stale or absent coverage.
          if-no-files-found: error
          retention-days: 1

  # Dependency vulnerability audit. Independent of the tests so a failing test no
  # longer waits behind the network-backed advisory lookup, and vice versa. The
  # audited population (runtime + build + audit tool) is exactly what it was
  # inside the old serial `verify` job (ADR 0029).
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/build.txt
            requirements/pip-audit.txt

      - name: Install package
        run: |
          # Hash-locked dependency closure and build backend first, then the
          # package itself, so nothing unpinned can enter the environment (#142).
          # --no-build-isolation keeps the editable install's PEP 517 build from
          # fetching hatchling unpinned.
          python -m pip install --require-hashes \
            -r requirements/runtime.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Dependency vulnerability audit
        run: |
          # Hash-locked audit tool for reproducible CI runs (#60, #142).
          python -m pip install --require-hashes -r requirements/pip-audit.txt
          # Retry: the advisory API is network-dependent, so a transient blip
          # should not fail the build. A real vulnerability fails all attempts.
          for i in 1 2 3; do
            if pip-audit; then exit 0; fi
            echo "pip-audit attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "pip-audit failed after 3 attempts"
          exit 1

  # Environment-pack content and release gates. Independent of tests and audit.
  content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/build.txt

      - name: Install package
        run: |
          python -m pip install --require-hashes \
            -r requirements/runtime.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Environment-pack-content gate
        run: raes-pack-validate --repo .

      - name: Pack release gate
        run: raes-pack-release check --all

      - name: First-party pack content gate
        run: raes-pack-validate --packs-root packs

      - name: First-party pack release gate
        run: raes-pack-release check --packs-root packs

  # Documentation build. Independent of the other mandatory jobs. Builds only the
  # public source root (docs/public/) warning-strict, so a broken cross-reference
  # fails the merge instead of publishing, then asserts the built site contains no
  # internal record (ADR 0030). The package itself is not installed: the pages are
  # narrative markdown with no autodoc.
  docs:
    runs-on: ubuntu-latest
    steps:
      # The prose gate compares the change with its base, so it needs the full
      # history.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/docs.txt

      - name: Install the hash-locked docs toolchain
        run: python -m pip install --require-hashes -r requirements/docs.txt

      - name: Build the public docs (warning-strict)
        run: python -m sphinx -W -b html docs/public docs/public/_build/html

      - name: Assert the publication boundary
        run: python tools/check_docs_publication_boundary.py docs/public/_build/html

      # Checks the changed Markdown files against the ASD-STE100 rules that a
      # tool can check (docs/development/documentation-style-guide.md).
      - name: Install the pinned Vale
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.2
          install_args: aqua:errata-ai/vale
          cache: false

      - name: Check the prose of the changed Markdown files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make prose BASE="$BASE"

  # Builds, vets, and tests the Go code of the port (ADR 0047) with the toolchain
  # that go.mod pins. It runs the same `make go-check` target as a local run, so
  # the two cannot drift. There is no module cache: the downloads are small, and a
  # cache adds a path for poisoned content.
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build, vet, and test the Go code
        run: make go-check

      - name: Upload Go coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage-go.out
          # A missing profile is a defect, not an empty upload: fail loudly so the
          # sonar job never scans stale or absent coverage.
          if-no-files-found: error
          retention-days: 1

  # Verifies the Go modules against go.sum and runs govulncheck with the
  # version that mise.toml pins, with `make go-audit`. A reachable known
  # vulnerability fails the job. It retries, because govulncheck reads the
  # vulnerability database on the network. A real finding fails each attempt.
  go-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the pinned govulncheck
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.2
          install_args: go:golang.org/x/vuln/cmd/govulncheck
          cache: false

      - name: Verify the modules and check for vulnerabilities
        run: |
          for i in 1 2 3; do
            if make go-audit; then exit 0; fi
            echo "go-audit attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "go-audit failed after 3 attempts"
          exit 1

  # Lints the Go code with the golangci-lint version that mise.toml pins and
  # mise.lock verifies, and checks formatting and module tidiness. The action
  # verifies the mise binary against its signed release checksums. No tool
  # cache: a cache adds a path for poisoned content.
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the pinned linter
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.2
          install_args: aqua:golangci/golangci-lint
          cache: false

      - name: Lint the Go code
        run: make go-lint

  # Checks the code, the design records, and the C4 view against the
  # architecture model with `make go-arch` (docs/development/designs/README.md).
  go-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the architecture
        run: make go-arch

  # Mutation testing on the Go lines that the change adds or changes, with
  # `make go-mutation` (docs/development/go-test-standard.md). The gate needs
  # the full history for the merge base, and the go-mutesting version that
  # mise.toml pins. The base is the base commit of the pull request, or the
  # commit before a push.
  go-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the pinned go-mutesting
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.2
          install_args: go:github.com/avito-tech/go-mutesting/cmd/go-mutesting
          cache: false

      - name: Run mutation testing on the changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make go-mutation BASE="$BASE"

  # Proves that each new regression test fails on the merge base, with
  # `make go-regression` (docs/development/go-test-standard.md).
  go-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Prove the regression tests
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make go-regression BASE="$BASE"

  sonar:
    runs-on: ubuntu-latest
    # Depend only on the coverage producers, not on the audit or pack gates: the
    # scanner's inputs are the same-run coverage.xml from `tests` and
    # coverage-go.out from `go`, so it starts as soon as both exist (ADR 0029).
    needs: [tests, go]
    # SonarCloud needs SONAR_TOKEN, which GitHub withholds from PRs that don't
    # carry repository secrets: forks and Dependabot PRs (Dependabot runs read a
    # separate secret store that this token isn't in). Skip both — the scan still
    # runs on the post-merge push to dev/main with full token access, so the
    # quality gate covers the integrated code. Dependency bumps don't touch the
    # analyzed source files anyway, so there is nothing new to analyze here.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        # The exact, same-run artifact the tests job produced — never a cross-run
        # or wildcard lookup. It lands as ./coverage.xml, which
        # sonar-project.properties points the scanner at.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-xml

      - name: Download Go coverage profile
        # The exact, same-run artifact the go job produced. It lands as
        # ./coverage-go.out, which sonar-project.properties names.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-go

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The required branch-protection status context (unchanged name). It is a
  # fail-closed aggregate: it runs even when a dependency fails (`if: always()`)
  # and is green only when every mandatory job succeeded, so a failed, cancelled,
  # or skipped mandatory job blocks the merge. Adding a mandatory job means
  # adding it to `needs` and to the check below (ADR 0029).
  verify:
    runs-on: ubuntu-latest
    needs: [compile, tests, audit, content, docs, go, go-lint, go-audit, go-arch, go-mutation, go-regression]
    if: always()
    steps:
      - name: Require every mandatory verification job to pass
        env:
          COMPILE: ${{ needs.compile.result }}
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.audit.result }}
          CONTENT: ${{ needs.content.result }}
          DOCS: ${{ needs.docs.result }}
          GO: ${{ needs.go.result }}
          GO_LINT: ${{ needs.go-lint.result }}
          GO_AUDIT: ${{ needs.go-audit.result }}
          GO_ARCH: ${{ needs.go-arch.result }}
          GO_MUTATION: ${{ needs.go-mutation.result }}
          GO_REGRESSION: ${{ needs.go-regression.result }}
        run: |
          echo "compile=$COMPILE tests=$TESTS audit=$AUDIT content=$CONTENT docs=$DOCS go=$GO go-lint=$GO_LINT go-audit=$GO_AUDIT go-arch=$GO_ARCH go-mutation=$GO_MUTATION go-regression=$GO_REGRESSION"
          for result in "$COMPILE" "$TESTS" "$AUDIT" "$CONTENT" "$DOCS" "$GO" "$GO_LINT" "$GO_AUDIT" "$GO_ARCH" "$GO_MUTATION" "$GO_REGRESSION"; do
            if [ "$result" != "success" ]; then
              echo "::error::A mandatory verification job did not succeed; blocking merge."
              exit 1
            fi
          done
          echo "All mandatory verification jobs passed."
