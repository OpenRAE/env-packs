version: 2
updates:
  # Keep SHA-pinned GitHub Actions patched (ADR 0006 supply-chain). CI-only, so
  # `chore` (no release). Batched into a single PR that a human merges once the
  # `verify` gate is green — nothing auto-merges (ADR 0020).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Hash-locked CI/docs toolchain (#142). These files are generated with
  # `uv pip compile --generate-hashes`; Dependabot regenerates the hashes when it
  # bumps a pin, so the `--require-hashes` installs keep resolving.
  #
  # CI-only toolchain, so `chore` (no release). Grouped into one PR because the
  # locks share transitive packages and a job installs several of them into one
  # environment -- splitting the bumps would land halves that disagree and fail
  # `--require-hashes`. tests/test_dependency_pinning.py enforces that agreement.
  #
  # requirements/runtime.txt is the resolved closure of pyproject's own
  # dependencies, so an raes bump can appear here. Every bump PR is merged by
  # a person (ADR 0020), so ADR 0011's human review of the pin is intact by
  # default, and a lock that drifts from pyproject fails the contract test rather
  # than silently installing a different version than the package declares.
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      ci-toolchain:
        patterns:
          - "*"
    ignore:
      # z3-solver and pydantic-core are not policy choices this repository can
      # make. Both appear in requirements/runtime.txt only as transitive entries
      # (`# via raes`, `# via pydantic`) whose versions their parents fix with an
      # exact `==`. Dependabot's pip updater treats every locked line as an
      # independently requested pin, so it proposes versions the closure cannot
      # resolve and the `--require-hashes` installs die on ResolutionImpossible
      # before a single test runs (#166, #170).
      #
      # z3-solver is additionally pinned by a governed contract upstream: the
      # raes-z3-finite-domain/v1 profile fixes package_version 4.16.0.0 /
      # engine_version 4.16.0 in SolverConfigurationModel, in the published
      # scenario-satisfiability-evidence-v1 schema, and in its fixtures, so
      # formal satisfiability evidence stays reproducible. OpenRAE/rae ignores
      # it for that reason after automated bumps broke it twice (rae#856,
      # rae#872); re-pinning the profile is a deliberate change with evidence to
      # regenerate, not Dependabot's call.
      #
      # Neither is stranded. Each moves when its parent moves — a raes bump
      # (ADR 0011, reviewed in isolation) or a pydantic release — and that bump
      # regenerates this closure with the new transitive version. A published
      # vulnerability in either is likewise fixed by advancing the parent, which
      # is the only install that resolves at all.
      - dependency-name: "z3-solver"
      - dependency-name: "pydantic-core"

  # Runtime Python dependencies (PyYAML, raes). They ship inside the
  # installed package, so a bump is `fix(deps)` — it cuts a patch release
  # (ADR 0016) so consumers actually receive the new floor. raes is left as
  # its own (ungrouped) PR so advancing the pinned RAES dependency is reviewed in
  # isolation (ADR 0011) rather than buried in a batch. Its CI compatibility gate
  # still runs automatically on the Dependabot PR.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # Same parent-pinned transitives as the /requirements entry above, and the
      # same reasoning — this entry reaches requirements/runtime.txt too, which
      # is how the unresolvable z3-solver bump in #166 was raised here rather
      # than there. Both directories have to decline it or the PR just returns
      # under the other one.
      - dependency-name: "z3-solver"
      - dependency-name: "pydantic-core"
