version: 2
updates:
  # Keep SHA-pinned GitHub Actions patched (ADR 0006 supply-chain). CI-only, so
  # `chore` (no release). Batched into a single PR that a human merges once the
  # `verify` gate is green — nothing auto-merges (ADR 0020).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Hash-locked CI/docs toolchain (#142). Each requirements/<name>.txt lock
  # compiles from requirements/<name>.in with `uv pip compile --generate-hashes`.
  # Dependabot re-resolves a lock only when an .in file with the same name
  # exists. It then runs pip-compile, so a transitive such as pydantic-core
  # moves together with its parent. A lock without an .in file gets one-line
  # edits, and those edits fail with ResolutionImpossible (#166, #170, #484).
  # For this reason, requirements/runtime.txt compiles from
  # requirements/runtime.in, which is a copy of the pyproject.toml dependencies.
  #
  # The locks are CI-only toolchain, so the prefix is `chore` (no release). One
  # group holds all bumps, because the locks share transitive packages and some
  # jobs install more than one lock into one environment.
  # tests/test_dependency_pinning.py checks that the locks agree.
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      ci-toolchain:
        patterns:
          - "*"
    ignore:
      # The pyproject.toml dependencies. The "/" entry below updates them in
      # pyproject.toml and requirements/runtime.in together. If this entry also
      # updated them, it would change runtime.in only, and the two lists would
      # not agree. tests/test_dependency_pinning.py keeps this list equal to
      # pyproject.toml.
      - dependency-name: "PyYAML"
      - dependency-name: "raes"
      - dependency-name: "mcp"
      - dependency-name: "jsonschema"
      - dependency-name: "anyio"
      # z3-solver is pinned by a governed contract upstream: the
      # raes-z3-finite-domain/v1 profile fixes package_version 4.16.0.0 /
      # engine_version 4.16.0 in SolverConfigurationModel, in the published
      # scenario-satisfiability-evidence-v1 schema, and in its fixtures, so
      # formal satisfiability evidence stays reproducible. OpenRAE/rae ignores
      # it for that reason after automated bumps broke it twice (rae#856,
      # rae#872). raes pins it with an exact `==`, so it moves only when a raes
      # bump re-resolves runtime.txt.
      - dependency-name: "z3-solver"

  # Go modules (ADR 0047). Dependabot reads this file on the default branch, so
  # this entry starts when the Go port reaches main. The Go binary embeds its
  # modules, so a bump is `fix(deps)` and cuts a patch release, as for the
  # runtime Python dependencies below. Each bump is its own PR.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: fix
      include: scope

  # Runtime Python dependencies, as pyproject.toml declares them. They ship
  # inside the installed package, so a bump is `fix(deps)`. It cuts a patch
  # release (ADR 0016), so consumers get the new floor. Each bump is its own
  # (ungrouped) PR, so a raes bump gets review in isolation (ADR 0011). Its CI
  # compatibility gate still runs automatically on the Dependabot PR.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: fix
      include: scope
    # This entry also reads the files in requirements/. Without a name list, it
    # opens a separate `fix(deps)` PR for CI tools and transitives in those
    # locks, for example #298, #385, and #484. Those PRs duplicate the
    # ci-toolchain group, and they cut releases for changes that do not ship.
    # This list allows only the pyproject.toml dependencies. Dependabot updates
    # each one in pyproject.toml and requirements/runtime.in, then re-resolves
    # requirements/runtime.txt. tests/test_dependency_pinning.py keeps this
    # list equal to pyproject.toml.
    allow:
      - dependency-name: "PyYAML"
      - dependency-name: "raes"
      - dependency-name: "mcp"
      - dependency-name: "jsonschema"
      - dependency-name: "anyio"
