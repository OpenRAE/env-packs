version: 1
equivalents:
  - file: tools/policyinput/main.go
    function: main
    mutator: branch/if
    line: "status = outcome.ToolFailure"
    mutated: "_, _ = status, outcome.ToolFailure"
    reason: >-
      This error requires Close on the sole owned os.Root to fail. No code
      closes that root or its descriptor before this call, and collection
      only opens independent files through Root.FS. The operating system
      therefore cannot return an ordinary close error on this path.
  - file: tools/policyinput/main.go
    function: shellCommands
    mutator: branch/if
    line: "printErr = err"
    mutated: "_, _ = printErr, err"
    reason: >-
      wordText prints only parser-produced WordPart nodes with default
      printer options into bytes.Buffer. Printer 3.14.1 accepts WordPart
      nodes, and this writer never returns an error. No parsed script can
      reach the error assignment; the parser itself has a tested error path.
  - file: tools/policyinput/main.go
    function: shellCommands
    mutator: statement/remove
    line: "printErr = err"
    mutated: "_, _ = printErr, err"
    reason: >-
      wordText prints parser-produced WordPart nodes into bytes.Buffer with
      default printer options. Printer 3.14.1 accepts these nodes and the
      writer cannot fail, so no parsed script reaches this assignment.
  - file: tools/policyinput/main.go
    function: wordText
    mutator: branch/if
    line: 'return "", err'
    mutated: "_ = err"
    reason: >-
      Recursive quoted parts have the same valid WordPart types as their
      parent. The only source of an error is the default printer into
      bytes.Buffer; its supported node types and infallible writer make
      that error unreachable for parser-produced words.
  - file: tools/policyinput/main.go
    function: wordText
    mutator: branch/if
    line: 'return "", errors.New("unsupported shell expression")'
    mutated: "_ = errors.New"
    reason: >-
      Printer 3.14.1 accepts every WordPart node, its default options do
      not conflict, and bytes.Buffer cannot fail a write. This error
      remains defensive against future printer changes, but no parsed
      shell word can trigger it at the pinned version.
  - file: internal/architecture/c4.go
    function: RenderDSL
    mutator: branch/if
    line: "panic(err)"
    mutated: "_ = err"
    reason: >-
      Execute fails only for a defect in the fixed template, and the golden
      test of the view checks the template. No input reaches the panic.
  - file: internal/packfs/root.go
    function: ""
    mutator: numbers/incrementer
    line: "const noMode = 0"
    mutated: "const noMode = 1"
    reason: >-
      An open without O_CREAT ignores the mode argument, and each open that
      uses noMode is without O_CREAT.
  - file: internal/packfs/inventory.go
    function: walker.names
    mutator: numbers/incrementer
    line: "batch, err := dir.Readdirnames(w.maxMembers - w.members + 1)"
    mutated: "batch, err := dir.Readdirnames(w.maxMembers - w.members + 2)"
    reason: >-
      A larger batch only reads more names before the budget check. The check
      fails the walk after the same number of names, and a walk within the
      budget lists the same names.
  - file: internal/packfs/inventory.go
    function: walker.names
    mutator: arithmetic/base
    line: "batch, err := dir.Readdirnames(w.maxMembers - w.members + 1)"
    mutated: "batch, err := dir.Readdirnames(w.maxMembers + w.members + 1)"
    reason: >-
      A larger batch only reads more names before the budget check. The check
      fails the walk after the same number of names, and a walk within the
      budget lists the same names.
  - file: internal/document/pyyaml.go
    function: pyFloatValue
    mutator: numbers/decrementer
    line: "digit, _ := strconv.ParseFloat(part, 64) //nolint:errcheck // See the comment above: the result is right for each admitted input."
    mutated: "digit, _ := strconv.ParseFloat(part, 63) //nolint:errcheck // See the comment above: the result is right for each admitted input."
    reason: >-
      ParseFloat reads each bit size other than 32 as 64, so a bit size of 63
      gives the same result.
  - file: internal/document/pyyaml.go
    function: pyFloatValue
    mutator: numbers/incrementer
    line: "digit, _ := strconv.ParseFloat(part, 64) //nolint:errcheck // See the comment above: the result is right for each admitted input."
    mutated: "digit, _ := strconv.ParseFloat(part, 65) //nolint:errcheck // See the comment above: the result is right for each admitted input."
    reason: >-
      ParseFloat reads each bit size other than 32 as 64, so a bit size of 65
      gives the same result.
  - file: internal/document/yaml.go
    function: checkScalar
    mutator: branch/if
    line: "return nil, fail(CodeSyntax, n.Line)"
    mutated: "_, _, _ = fail, CodeSyntax, n.Line"
    reason: >-
      The walk rejects a scalar with an explicit tag before this decode, and
      yaml.v3 resolves each scalar without a tag to a value. No input reaches
      the error.
  - file: internal/jsondoc/jsondoc.go
    function: writeObject
    mutator: branch/if
    line: "return err"
    mutated: "_ = err"
    reason: >-
      After a failed token, the encoder fails a later token of the object, so
      Marshal still returns an error and no bytes. The token sequence is
      valid and a bytes.Buffer does not fail, so only a token with invalid
      UTF-8 or past the nesting limit of jsontext fails.
  - file: internal/jsondoc/jsondoc.go
    function: writeObject
    mutator: branch/if
    line: "return err"
    occurrence: 2
    mutated: "_ = err"
    reason: >-
      After a name with invalid UTF-8 fails, the object has one token less
      than its pairs need, so a later token or the end of the object fails,
      and Marshal still returns an error and no bytes.
  - file: internal/jsondoc/jsondoc.go
    function: writeArray
    mutator: branch/if
    line: "return err"
    mutated: "_ = err"
    reason: >-
      After a failed start of an array, the end of the array fails, so
      Marshal still returns an error and no bytes. The start fails only past
      the nesting limit of jsontext.
  - file: internal/jsondoc/jsondoc.go
    function: pythonFloat
    mutator: numbers/decrementer
    line: "if a := math.Abs(f); a != 0 && (a < 1e-4 || a >= 1e16) {"
    mutated: "if a := math.Abs(f); a != 0 && (a < 1e-4 || a >= 10000000000000000) {"
    reason: >-
      The literal 10000000000000000 is the same float64 as 1e16.
  - file: internal/jsondoc/jsondoc.go
    function: pythonFloat
    mutator: numbers/incrementer
    line: "return strconv.FormatFloat(f, 'e', -1, 64), nil"
    mutated: "return strconv.FormatFloat(f, 'e', -2, 64), nil"
    reason: >-
      FormatFloat gives the shortest digits for each negative precision, so
      -2 gives the same result as -1.
  - file: internal/jsondoc/jsondoc.go
    function: pythonFloat
    mutator: numbers/incrementer
    line: "s := strconv.FormatFloat(f, 'f', -1, 64)"
    mutated: "s := strconv.FormatFloat(f, 'f', -2, 64)"
    reason: >-
      FormatFloat gives the shortest digits for each negative precision, so
      -2 gives the same result as -1.
  - file: internal/terminal/terminal.go
    function: Escape
    mutator: expression/comparison
    line: "case r < 0x100:"
    mutated: "case r <= 0x100:"
    reason: >-
      U+0100 is printable, so it does not reach this case, and the two forms
      give the same result.
  - file: internal/terminal/terminal.go
    function: Quote
    mutator: expression/comparison
    line: "case r < 0x100:"
    mutated: "case r <= 0x100:"
    reason: >-
      U+0100 is printable, so it does not reach this case, and the two forms
      give the same result.
  - file: internal/terminal/terminal.go
    function: Quote
    mutator: expression/comparison
    line: "case r < 0x10000:"
    mutated: "case r <= 0x10000:"
    reason: >-
      U+10000 is printable, so it does not reach this case, and the two forms
      give the same result.
  - file: cmd/raes-pack-issue-skeleton/main.go
    function: ghPath
    mutator: branch/if
    line: "return \"\", err"
    occurrence: 2
    mutated: "_ = err"
    reason: >-
      LookPath has just found the file, and it follows symlinks to do so, so
      EvalSymlinks fails only when the file changes between the two calls.
  - file: cmd/raes-pack-issue-skeleton/main.go
    function: ghPath
    mutator: branch/if
    line: "return \"\", err"
    occurrence: 3
    mutated: "_ = err"
    reason: >-
      LookPath and EvalSymlinks have just found each path, so Stat fails only
      when a path changes between the calls.
